<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>サイコロ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f2;color:#243c34;font-family:system-ui,"Yu Gothic",sans-serif;display:grid;place-items:center;min-height:100svh}.app{width:min(100%,800px);min-height:100svh;padding:24px;display:flex;flex-direction:column}.head{display:flex;justify-content:space-between;align-items:center;gap:8px}.head h1{margin:0;font-size:26px;letter-spacing:.07em}.sub{font-size:12px;letter-spacing:.12em;color:#718079;font-weight:700}.selector{display:flex;gap:4px;padding:5px;border-radius:17px;background:white}.selector button{border:0;border-radius:13px;background:transparent;font-weight:800;font-size:15px;padding:12px;cursor:pointer;color:#63736d}.selector button.on{background:#238464;color:white}.arena{position:relative;flex:1;min-height:360px;margin:22px 0 12px;display:flex;align-items:center;justify-content:center;border-radius:30px;overflow:hidden;background:radial-gradient(ellipse at center,#d8e8db,#eef3ec 76%)}.arena:before{content:"";position:absolute;border:2px solid #ffffff8a;border-radius:50%;width:83%;height:60%;transform:rotate(-17deg)}.arena:after{content:"";position:absolute;width:70%;height:20px;bottom:22%;background:#8fa89866;filter:blur(14px);border-radius:50%}.dice{display:flex;gap:clamp(13px,4vw,40px);justify-content:center;align-items:center;position:relative;z-index:1;padding:40px 8px 60px;width:100%}.wrap{position:relative;width:clamp(73px,17vw,112px);aspect-ratio:1;filter:drop-shadow(0 21px 12px #27473638)}.die{position:relative;width:100%;height:100%;border-radius:17%;border:1px solid #cfd9d2;background:linear-gradient(140deg,#fff 15%,#f5f8f5 55%,#e4ebe5);box-shadow:inset 4px 4px 10px #fff,inset -6px -7px 12px #d1dbd4,4px 5px 0 #b9c8bd,7px 9px 12px #162e241c}.pip{position:absolute;width:17%;height:17%;border-radius:50%;transform:translate(-50%,-50%);background:#273f3a;box-shadow:inset 1px 2px 2px #14272166}.pip.red{background:#e35d56}.rolling{animation:jump 1.15s cubic-bezier(.22,.58,.18,1) both}.rolling .die{animation:spin 1.15s ease-out both}.wrap:nth-child(2){animation-delay:.08s}.wrap:nth-child(3){animation-delay:.15s}.wrap:nth-child(2) .die{animation-delay:.08s}.wrap:nth-child(3) .die{animation-delay:.15s}@keyframes jump{0%{transform:translateY(0)}28%{transform:translateY(-100px)}65%{transform:translateY(-20px)}79%{transform:translateY(0) scale(1.08,.91)}90%{transform:translateY(-15px)}100%{transform:translateY(0)}}@keyframes spin{0%{transform:rotate(0) rotateY(0)}35%{transform:rotate(220deg) rotateY(55deg)}75%{transform:rotate(650deg) rotateY(-30deg)}100%{transform:rotate(720deg) rotateY(0)}}.flash{position:absolute;inset:-24px;border-radius:50%;pointer-events:none;opacity:0;background:radial-gradient(circle,#fff5b3c9,#fff0a355 35%,transparent 72%)}.shine .flash{animation:glow .65s ease-out}.spark{position:absolute;color:#e9ba38;font-size:24px;opacity:0;pointer-events:none}.spark.a{left:-27%;top:-24%}.spark.b{right:-26%;top:1%}.spark.c{left:35%;bottom:-26%}.shine .spark{animation:star .7s ease-out}@keyframes glow{20%{opacity:1;transform:scale(.85)}100%{opacity:0;transform:scale(1.75)}}@keyframes star{20%{opacity:1;transform:scale(.7) rotate(15deg)}100%{opacity:0;transform:scale(1.6) rotate(80deg)}}.bottom{display:flex;align-items:center;flex-direction:column;gap:19px}.result{display:flex;align-items:center;gap:15px;min-height:54px}.result small{font-weight:700;color:#78847c}.result strong{font-size:38px;font-variant-numeric:tabular-nums}.result span{font-size:14px;color:#728178}.roll{width:min(100%,420px);height:72px;background:linear-gradient(#37a37f,#218061);color:white;border:none;border-radius:19px;font-size:23px;font-weight:900;letter-spacing:.15em;cursor:pointer;box-shadow:0 8px #165c45,0 14px 22px #1b62422e}.roll:active{transform:translateY(5px);box-shadow:0 3px #165c45}.roll:disabled{opacity:.7}.hint{font-size:12px;color:#819086}@media(max-width:500px){.app{padding:18px 13px 25px}.selector button{padding:10px}.arena{min-height:340px}.dice{gap:15px}}
</style></head><body><main class="app"><header class="head"><div><div class="sub">DICE ROLL</div><h1>サイコロ</h1></div><nav class="selector" aria-label="サイコロの個数"><button data-count="1">1個</button><button data-count="2" class="on">2個</button><button data-count="3">3個</button></nav></header><section class="arena"><div class="dice" id="dice"></div></section><footer class="bottom"><div class="result" aria-live="polite"><small>合計</small><strong id="total">7</strong><span id="numbers">3 + 4</span></div><button class="roll" id="roll">サイコロをふる</button><div class="hint">ボタンを押してサイコロを振ろう</div></footer></main><script>
const dice=document.getElementById('dice'),total=document.getElementById('total'),numbers=document.getElementById('numbers'),rollButton=document.getElementById('roll');let count=2,values=[3,4],busy=false;
const spots={1:[[50,50]],2:[[27,27],[73,73]],3:[[27,27],[50,50],[73,73]],4:[[27,27],[73,27],[27,73],[73,73]],5:[[27,27],[73,27],[50,50],[27,73],[73,73]],6:[[27,25],[73,25],[27,50],[73,50],[27,75],[73,75]]};
function pips(n){return spots[n].map(([x,y])=>'<i class="pip '+(n===1?'red':'')+'" style="left:'+x+'%;top:'+y+'%"></i>').join('')}
function makeDie(n){let w=document.createElement('div');w.className='wrap';w.innerHTML='<div class="flash"></div><span class="spark a">✦</span><span class="spark b">✦</span><span class="spark c">✦</span><div class="die">'+pips(n)+'</div>';return w}
function randomDie(){if(crypto?.getRandomValues){const n=new Uint32Array(1);crypto.getRandomValues(n);return n[0]%6+1}return Math.floor(Math.random()*6)+1}
function result(){const v=values.slice(0,count);total.textContent=v.reduce((a,b)=>a+b,0);numbers.textContent=v.join(' + ')}
function render(){dice.replaceChildren(...values.slice(0,count).map(makeDie));result();document.querySelectorAll('[data-count]').forEach(b=>{b.classList.toggle('on',+b.dataset.count===count);b.setAttribute('aria-pressed',String(+b.dataset.count===count))})}
function roll(){if(busy)return;busy=true;rollButton.disabled=true;rollButton.textContent='ころころ…';total.textContent='—';numbers.textContent='';const wraps=[...dice.children],next=Array.from({length:count},randomDie);wraps.forEach(w=>{w.classList.remove('rolling','shine');void w.offsetWidth;w.classList.add('rolling')});setTimeout(()=>{values=next;wraps.forEach((w,i)=>{w.querySelector('.die').innerHTML=pips(next[i]);w.classList.remove('rolling');w.classList.add('shine')});result();rollButton.disabled=false;rollButton.textContent='もう一度ふる';busy=false},1400)}
document.querySelectorAll('[data-count]').forEach(b=>b.addEventListener('click',()=>{if(busy)return;count=+b.dataset.count;while(values.length<count)values.push(randomDie());render()}));rollButton.addEventListener('click',roll);render();
</script></body></html>
