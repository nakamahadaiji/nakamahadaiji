<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>LIFE Lv.</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">REAL LIFE RPG</p>
        <h1>LIFE <span>Lv.</span></h1>
      </div>
      <button id="settingsBtn" class="icon-btn" aria-label="設定">⚙</button>
    </header>

    <main>
      <section class="hero-card glass">
        <div class="hero-head">
          <div>
            <p id="playerName" class="player-name">PLAYER</p>
            <p id="playerClass" class="player-class">CLASS / EXPLORER</p>
          </div>
          <div class="level-orb">
            <span>LV</span>
            <strong id="levelValue">1</strong>
          </div>
        </div>
        <div class="xp-block">
          <div class="xp-copy"><span>EXP</span><strong id="xpText">0 / 100</strong></div>
          <div class="progress"><i id="xpBar"></i></div>
          <p id="xpNext">あと100 EXPでLEVEL UP</p>
        </div>
        <div class="hero-stats">
          <div><span>🔥 STREAK</span><strong id="streakValue">0</strong><small>days</small></div>
          <div><span>✓ CLEARS</span><strong id="clearsValue">0</strong><small>quests</small></div>
          <div><span>🏆 TITLES</span><strong id="titlesValue">0</strong><small>unlocked</small></div>
        </div>
      </section>

      <section class="section-head">
        <div><p class="eyebrow">TODAY</p><h2>今日のクエスト</h2></div>
        <button id="shuffleBtn" class="text-btn">更新</button>
      </section>
      <section id="questList" class="quest-list"></section>

      <section class="section-head">
        <div><p class="eyebrow">STATUS</p><h2>人生ステータス</h2></div>
      </section>
      <section id="statusGrid" class="status-grid"></section>

      <section class="section-head">
        <div><p class="eyebrow">ACHIEVEMENTS</p><h2>実績</h2></div>
      </section>
      <section id="achievementList" class="achievement-list"></section>
    </main>

    <nav class="bottom-nav">
      <button class="nav-item active" data-scroll="top">⌂<span>HOME</span></button>
      <button class="nav-item" data-scroll="questList">✦<span>QUEST</span></button>
      <button class="nav-item" data-scroll="statusGrid">◈<span>STATUS</span></button>
      <button class="nav-item" data-scroll="achievementList">🏆<span>BADGE</span></button>
    </nav>
  </div>

  <div id="toast" class="toast"></div>
  <div id="levelModal" class="modal-wrap hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <p class="eyebrow">LEVEL UP</p>
      <div class="level-burst">✦</div>
      <h3>LEVEL <span id="modalLevel">2</span></h3>
      <p id="modalMessage">今日の一歩が、ちゃんと積み上がった。</p>
      <button id="closeModal" class="primary-btn">つづける</button>
    </div>
  </div>

  <div id="settingsPanel" class="sheet-wrap hidden">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <h3>プレイヤー設定</h3>
      <label>名前<input id="nameInput" maxlength="14" placeholder="PLAYER" /></label>
      <label>クラス<select id="classSelect"><option>EXPLORER</option><option>CREATOR</option><option>GUARDIAN</option><option>CHALLENGER</option><option>SCHOLAR</option></select></label>
      <div class="sheet-actions">
        <button id="resetBtn" class="danger-btn">データを初期化</button>
        <button id="saveSettingsBtn" class="primary-btn">保存</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
