</style></head><body><header><strong>前岡島 <span style="color:var(--accent)">投票マッチング</span></strong><span class="tag">模擬選挙</span></header><main id="app"></main><footer>前岡島の模擬選挙 · 回答は外部に送信されません</footer><script>
const questions=[
["学校を整える","子どもが減っても、学校の整備を優先する？","教室やトイレを直します。その分、病院や道路に使えるお金は減ります。",'安心して学べる学校になります。','病院や道路の予算が減ります。'],
["給食費・教材費","税金で給食費や教材費を安くする？","家庭の負担を減らすため、ほかの事業の予算を一部回します。",'子育て家庭の負担が減ります。','学校の修理などの予算が減ります。'],
["医療と介護","予算の半分を、医療や介護に使う？","1億円のうち5000万円を使い、医師の確保や介護を支えます。",'診療や介護の支援を充実させられます。','ほかの4分野は残り5000万円でまかないます。'],
["通院と見守り","病院の設備より、送迎や見守りを優先する？","通院の送迎や高齢者の見守りに、医療・福祉の予算を多く使います。",'移動が難しい人や、一人暮らしの人を支えます。','病院の設備更新が遅れる場合があります。'],
["働く場所を増やす","会社や工場を呼ぶために、5000万円使う？","働く場所を増やすための施設を整えます。その分、ほかの予算は減ります。",'会社が来れば、働く場所の増加が期待できます。','お金をかけても、会社が来るとは限りません。'],
["地元の店や工場","新しい会社より、地元の店や工場を支える？","会社を外から呼ぶより、今ある事業の設備や後継者の育成にお金を使います。",'地元の仕事や技術を守ることにつながります。','新しい会社を呼ぶための予算が減ります。'],
["観光を元気にする","道路の整備より、観光にお金を使う？","観光施設やイベントを優先します。道路などの整備は一部後回しになります。",'観光客が増えれば、店の売上増加が期待できます。','道路など、暮らしに必要な整備が遅れます。'],
["地域のバス","乗る人が少なくても、バスを残す？","運賃だけでは足りない運行費を、税金で補います。",'車を使えない人も通院や買い物に行けます。','運行を支えるお金が毎年かかります。'],
["道路と防災","観光施設より、道路の修理や防災を優先する？","新しい観光施設より、古い道路・橋の修理や災害への備えにお金を使います。",'移動の安全や、災害への備えにつながります。','観光客を増やす取り組みの予算が減ります。'],
["予算の分け方","1億円を、5つの分野に同じ額ずつ配る？","教育、医療・福祉、商工業、文化・観光、道路・交通に2000万円ずつ配ります。",'すべての分野にお金を使えます。','特に困っている分野に予算を集中できません。']];
const candidates=[
{name:'高橋 翔太',kana:'たかはし しょうた',policy:'子どもたちの未来をつくる教育改革',budget:[5000,500,500,3000,1000],a:[4,4,0,2,0,2,3,2,1,0]},
{name:'佐藤 美咲',kana:'さとう みさき',policy:'安心して暮らせる医療・福祉の国へ',budget:[3000,5000,500,500,1000],a:[3,3,4,3,0,2,0,3,2,0]},
{name:'中村 健吾',kana:'なかむら けんご',policy:'ものづくりで経済を立て直す',budget:[3000,0,5000,0,2000],a:[3,2,0,2,4,1,0,2,3,0]},
{name:'石川 大輔',kana:'いしかわ だいすけ',policy:'安心・安全な暮らしを取り戻す',budget:[1000,3000,500,500,5000],a:[1,1,3,2,0,2,0,4,4,0]},
{name:'小林 彩乃',kana:'こばやし あやの',policy:'文化の力で、この国を元気に',budget:[3000,500,1000,5000,500],a:[3,2,0,2,1,3,4,2,0,0]},
{name:'九条 光一郎',kana:'くじょう こういちろう',policy:'実績ある一族だからこそできる国づくり',budget:[2000,2000,2000,2000,2000],a:[2,2,0,2,0,2,2,2,2,4]}];
const labels=['反対','やや反対','中立','やや賛成','賛成'],symbols=['×','△','◇','○','◎'],fields=['教育','医療・福祉','商業・工業','文化・観光','道路・交通'];
let answers=Array(10).fill(null),important=[],step=0,mode='home';
let candidateDraft=candidates.map(c=>[...c.a]);
const app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function mark(v){return `<span class="mark m${v===null?'n':v}" role="img" aria-label="${v===null?'無回答':labels[v]}">${v===null?'−':symbols[v]}</span>`;}
function score(a,b,priority){let sum=0,total=0;for(let i=0;i<10;i++){if(a[i]===null||b[i]===null)continue;const w=priority.includes(i)?2:1;sum+=(1-Math.abs(a[i]-b[i])/4)*w;total+=w;}return total?Math.round(100*sum/total):null;}
function rankings(){return candidates.map((c,i)=>({...c,id:i,score:score(answers,c.a,important)})).sort((a,b)=>(b.score??-1)-(a.score??-1));}
function go(m){mode=m;render();window.scrollTo(0,0);app.focus({preventScroll:true});}
app.tabIndex=-1;
function cards(){return candidates.map(c=>`<article class="candidate-card"><h3>${c.name}</h3><small>${c.kana}</small><p>${c.policy}</p><div class="budget" aria-hidden="true">${c.budget.map(n=>`<span style="width:${n/100}%"></span>`).join('')}</div><dl class="budget-list">${fields.map((f,i)=>`<dt>${f}</dt><dd>${c.budget[i]}万円</dd>`).join('')}</dl></article>`).join('');}
function home(){return `<section class="hero"><div class="kicker">あなたの一票で、島の未来を。</div><h1>前岡島<br><span>投票マッチング</span></h1><svg class="island-art" viewBox="0 0 600 300" aria-hidden="true" focusable="false"><g fill="none" stroke="#28595b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><circle cx="477" cy="57" r="25" fill="#ffcf69" stroke="none"/><path d="M63 77q0-17 18-17q12-24 30-7q23-5 27 15q1 13-17 13H63" fill="#fff" stroke="none"/><path d="M384 40q2-12 16-12q9-18 24-5q20-2 20 15z" fill="#fff" stroke="none"/><ellipse cx="300" cy="243" rx="244" ry="38" fill="#b5e2e4" stroke="none"/><path d="M110 207q29-75 104-63q84-78 162-16q95-6 121 79q-31 56-192 56q-143 0-195-56" fill="#f5dfb5"/><path d="M123 194q22-52 93-45q77-66 156-13q88 0 113 57q-64 41-188 40q-113-1-174-39" fill="#aed3ac" stroke="none"/><path d="M158 171v-48h63v48" fill="#fff8e9"/><path d="m149 125 40-34 41 34" fill="#ec9382"/><path d="M182 171v-28h18v28" fill="#ffd071"/><path d="M418 164v-39h43v39" fill="#fff8e9"/><path d="m410 126 30-25 30 25" fill="#ffd071"/><path d="M430 146h18M439 137v18"/><path d="M119 179v-40m-16 0q-10-32 17-45q27 17 16 45z" fill="#72b7a1"/><path d="M481 183v-36m-16 1q-4-30 18-39q23 14 13 39z" fill="#72b7a1"/><path d="m242 142 104-8 24 23-104 10z" fill="#f8fcf7"/><path d="m242 142 24 25v68l-24-23z" fill="#e9b75a"/><path d="m266 167 104-10v68l-104 10z" fill="#ffda7e"/><path d="m276 147 50-4" stroke-width="6"/><path d="m278 135-11-47 56-13 12 59" fill="#fff8e9"/><path d="m282 106 12 9 17-23" stroke="#4e9a8b" stroke-width="6"/><circle cx="296" cy="193" r="3" fill="#28595b" stroke="none"/><circle cx="337" cy="189" r="3" fill="#28595b" stroke="none"/><path d="M307 204q10 9 19-2"/><path d="M265 185q-18 4-25-6m130 0q17-3 24-15"/><path d="m204 49 6 11m-50 9 11 4m199 8 7-10" stroke="#ed9382"/><path d="M49 251h28m439-12h29m-373 43h36m190-1h24" stroke="#85c6ca"/></g></svg><p>10問に答えて、<br>自分の考えに近い候補者を見つけよう。</p><div class="hero-meta"><span>全10問</span><span>候補者6人</span><span>約3分</span></div><div class="actions"><button class="primary start-button" data-action="start">はじめる <span aria-hidden="true">→</span></button></div></section><p class="small-note">架空の島の模擬選挙です。候補者の回答は教材用の設定です。</p><section class="home-bottom"><details><summary>前岡島って、どんな島？</summary><div class="quiet-info"><p>使える特別予算は<strong>1億円</strong>。何に多く使うかで、島の未来が変わります。</p><ul class="island-facts"><li>子どもが減っている</li><li>高齢者が多い</li><li>働く場所が少ない</li><li>観光客が減っている</li><li>道路や交通が古くなっている</li></ul></div></details><details><summary>6人の候補者を見る</summary><div class="candidate-grid" style="margin-top:18px">${cards()}</div></details><details><summary>このアプリについて</summary><div class="quiet-info"><p>候補者の政策・予算は授業資料に基づいています。10問への回答は、政策を参考に補った仮設定です。</p><p>質問に答えた後、特に大切な3問を選ぶと、候補者との考えの近さを比較できます。投票先を決める参考にしてください。</p><p>予算の単位は万円です。中村健吾の図にない医療・福祉と文化・観光は、記載額の合計が1億円になるため0万円としています。</p></div></details></section>`;}
function question(){const q=questions[step];return `<div class="progress"><b>Q${String(step+1).padStart(2,'0')} <small>/ 10</small></b><div class="track"><i style="width:${(step+1)*10}%"></i></div></div><div class="topic">${q[0]}</div><h2 class="question">${q[1]}</h2><p class="context">${q[2]}</p><div class="choices">${[4,3,2,1,0].map(v=>`<button class="choice" data-v="${v}" aria-pressed="${answers[step]===v}">${labels[v]}</button>`).join('')}</div><div class="twocol"><section class="point"><h3>＋ メリット</h3><p>${q[3]}</p></section><section class="point"><h3>− デメリット</h3><p>${q[4]}</p></section></div><div class="nav"><button class="plain" data-action="back">‹ ${step?'戻る':'トップ'}</button><button class="plain" data-action="skip">わからない →</button></div>${step===0?'<p class="small-note">回答すると次へ進みます。「戻る」で変更できます。</p>':''}`;}
function priorities(){return `<div class="eyebrow">あとひとつ</div><h2 class="priority-heading" style="margin-top:12px">大切にしたいことを<br>3つ選ぼう。</h2><p class="muted">選んだ3つを、結果により強く反映します。</p><div>${questions.map((q,i)=>`<label class="checkrow"><input type="checkbox" data-priority="${i}" ${important.includes(i)?'checked':''} ${important.length===3&&!important.includes(i)?'disabled':''}><b>Q${String(i+1).padStart(2,'0')}</b><span>${q[0]}</span></label>`).join('')}</div><div class="actions"><button class="primary" data-action="result" ${important.length!==3?'disabled':''}>結果を見る →</button><span class="priority-count" role="status">${important.length} / 3 選択</span></div><button class="plain review-link" data-action="last">‹ 回答を見直す</button><p class="selection-note">選んだ質問は、計算で2倍の重みをつけます。</p>`;}
function results(){let rows=rankings();return `<section class="result-title"><h1>投票マッチング結果</h1><p>あなたの考えに近い順に並んでいます。</p></section>${answers.every(a=>a===null)?'<p class="error">回答がないため、結果を出せません。「回答を見直す」から答えてください。</p>':''}<div class="table-hint"><span>← 横に動かして比較 →</span><span>★ 大切にした質問</span></div><div class="tablewrap"><table><thead><tr><th>候補者</th><th>マッチング率</th>${questions.map((q,i)=>`<th>Q${i+1} ${important.includes(i)?'★':''}<br>${q[1]}</th>`).join('')}</tr></thead><tbody><tr class="you"><td><strong>あなたの回答</strong></td><td>—</td>${answers.map(a=>`<td>${mark(a)}</td>`).join('')}</tr>${rows.map((c,i)=>`<tr><td class="person"><span class="rank">${c.score===null?'':`${1+rows.filter(r=>r.score>c.score).length}位`}</span><b>${c.name}</b><small>${c.kana}</small></td><td>${c.score===null?'算出不可':`<div class="ring" style="--score:${c.score}"><span>${c.score}%</span></div>`}</td>${c.a.map(a=>`<td>${mark(a)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="legend">${[4,3,2,1,0,null].map(v=>`<span>${mark(v)} ${v===null?'無回答':labels[v]}</span>`).join('')}</div><div class="actions"><button class="primary" data-action="download">結果を保存</button><button class="secondary" data-action="review">回答を見直す</button><button class="plain" data-action="restart">やり直す</button></div><p id="status" role="status"></p><p class="result-footnote">教材用の候補者設定との比較です。投票先を決める参考にしてください。</p><div class="bottom-details"><details><summary>マッチング率の計算方法</summary><p class="muted">回答を「反対＝0」から「賛成＝4」の5段階にします。候補者と同じ回答は100点、1段階違いは75点、2段階は50点、3段階は25点、4段階は0点。重視した3問は2倍にして平均し、整数に四捨五入します。どちらかが無回答の質問は計算から除きます。同率は同順位です。</p></details><details><summary>候補者の政策と予算</summary><div class="candidate-grid" style="margin-top:18px">${cards()}</div></details><details><summary>先生向け：候補者の回答設定</summary><p class="muted">候補者の回答は、資料にない優先順位も補った仮設定です。授業に合わせて変更できます。「反映する」で確定し、ページを閉じると元に戻ります。</p><div class="tablewrap editor"><table><thead><tr><th>候補者</th>${questions.map((q,i)=>`<th>Q${i+1}<br>${q[0]}</th>`).join('')}</tr></thead><tbody>${candidates.map((c,ci)=>`<tr><td>${c.name}</td>${candidateDraft[ci].map((a,qi)=>`<td><select aria-label="${c.name} Q${qi+1}" data-candidate="${ci}" data-question="${qi}">${[4,3,2,1,0,null].map(v=>`<option value="${v===null?'null':v}" ${a===v?'selected':''}>${v===null?'無回答':labels[v]}</option>`).join('')}</select></td>`).join('')}</tr>`).join('')}</tbody></table></div><button class="secondary" data-action="apply">反映する</button></details></div>`;}
function render(){app.innerHTML=mode==='home'?home():mode==='question'?question():mode==='priorities'?priorities():results();}
function advance(v){answers[step]=v;if(step<9){step++;go('question');}else go('priorities');}
app.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.v!==undefined){advance(Number(b.dataset.v));return;}switch(b.dataset.action){case'start':step=0;go('question');break;case'back':if(step){step--;go('question');}else go('home');break;case'skip':advance(null);break;case'last':step=9;go('question');break;case'result':if(important.length===3)go('results');break;case'review':step=0;go('question');break;case'restart':if(confirm('回答を消して、最初からやり直しますか？')){answers=Array(10).fill(null);important=[];step=0;go('home');}break;case'download':download();break;case'apply':candidates.forEach((c,i)=>c.a=[...candidateDraft[i]]);go('results');break;}});
app.addEventListener('change',e=>{if(e.target.dataset.priority!==undefined){const i=Number(e.target.dataset.priority);if(e.target.checked&&important.length<3)important.push(i);else important=important.filter(x=>x!==i);const y=window.scrollY;render();window.scrollTo(0,y);}if(e.target.dataset.candidate!==undefined)candidateDraft[Number(e.target.dataset.candidate)][Number(e.target.dataset.question)]=e.target.value==='null'?null:Number(e.target.value);});
function download(){const text=['前岡島 投票マッチング結果','候補者の回答は教材用の仮設定です。','',...rankings().map(c=>`${c.name}：${c.score===null?'算出不可':c.score+'%'}`),'','あなたの回答',...questions.map((q,i)=>`Q${i+1} ${q[1]}\n${answers[i]===null?'無回答':labels[answers[i]]}${important.includes(i)?'【重視】':''}`),'','候補者の回答（計算時の設定）',...candidates.map(c=>`${c.name}：${c.a.map((a,i)=>`Q${i+1} ${a===null?'無回答':labels[a]}`).join(' ／ ')}`),'','計算：一致100点、1段階違い75点、2段階50点、3段階25点、4段階0点。重視した質問は2倍。無回答は除外。'].join('\n');const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='前岡島_マッチング結果.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('status').textContent='結果をテキストファイルにしました。';}
render();
</script></body></html>
