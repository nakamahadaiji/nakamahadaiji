<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7baebb"><title>前岡島｜投票マッチング</title><style>
:root{--ink:#172d32;--accent:#6d9eab;--line:#dce2e2;--paper:#f1f1e8;--blue:#8db3d6;--lightblue:#d5e6f6;--red:#d78079;--pink:#efcbc7}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif;line-height:1.8}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #21607d;outline-offset:4px}header{border-bottom:1px solid var(--line);padding:17px max(20px,calc((100% - 1000px)/2));display:flex;align-items:center;justify-content:space-between;gap:14px}header strong{font-size:18px;white-space:nowrap}.tag{font-size:12px;letter-spacing:.08em;color:#526a70}main{max-width:900px;margin:0 auto;padding:34px 24px 70px}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(28px,5vw,46px);line-height:1.5;letter-spacing:.02em}h2{font-size:clamp(23px,4vw,32px);line-height:1.65}p{line-height:1.9}.eyebrow{color:var(--accent);font-weight:700;letter-spacing:.15em;font-size:13px}.muted{color:#607277;font-size:14px}.hero{padding:40px 0 24px}.hero h1{margin:12px 0 20px}.rule{border:1px solid var(--line);border-radius:16px;padding:24px;margin:24px 0;background:#fafbf9}.stats{display:flex;gap:26px;padding:18px 0}.stats strong{font-size:27px;display:block}.stats span{font-size:13px;color:#607277}.primary,.secondary{border:0;border-radius:10px;padding:14px 25px;font-weight:700}.primary{background:var(--ink);color:white}.secondary{background:#edf2f2;color:var(--ink)}.actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:22px 0}.progress{display:flex;align-items:center;gap:22px;margin:0 0 25px}.progress b{color:var(--accent);font-size:29px;white-space:nowrap}.progress small{font-size:15px}.track{height:4px;background:#edf0f0;flex:1}.track i{height:4px;background:var(--accent);display:block}.topic{text-align:center;background:var(--paper);padding:10px;border-radius:9px;font-weight:700;font-size:18px;margin-bottom:28px}.question{text-align:center;max-width:730px;margin:0 auto 30px}.context{max-width:730px;margin:0 auto 28px;font-size:16px}.choices{max-width:620px;margin:0 auto 24px;display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.choice{grid-column:span 2;border:2px solid transparent;border-radius:13px;min-height:87px;font-size:19px;font-weight:700;color:#16272c}.choice:nth-child(4){grid-column:2/span 2}.choice:nth-child(5){grid-column:4/span 2}.choice[aria-pressed=true]{border-color:#172d32;box-shadow:0 0 0 3px #fff inset}.choice[data-v="4"]{background:var(--blue)}.choice[data-v="3"]{background:var(--lightblue)}.choice[data-v="2"]{background:#e7e7e7}.choice[data-v="1"]{background:var(--pink)}.choice[data-v="0"]{background:var(--red)}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:36px}.point{border-top:1px solid #789096;border-bottom:1px solid #789096;padding:15px 0}.point h3{font-size:18px;margin-bottom:10px}.point p{margin-bottom:0;font-size:15px}.nav{display:flex;justify-content:space-between;align-items:center;margin-top:28px}.plain{background:none;border:0;padding:10px;color:#536b73}.checkrow{display:flex;align-items:center;gap:15px;padding:17px 5px;border-bottom:1px solid var(--line);cursor:pointer}.checkrow input{width:22px;height:22px;accent-color:var(--accent)}.checkrow b{color:var(--accent);font-size:14px}.result-title{text-align:center;padding:15px 0}.result-title h1{color:var(--accent);font-size:30px;margin-bottom:8px}.result-title p{font-weight:700}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px;margin:22px 0;max-height:72vh}table{border-spacing:0;min-width:100%;font-size:14px}th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:17px 14px;text-align:center;min-width:130px}thead th{background:var(--paper);font-weight:600;position:sticky;top:0;z-index:2;font-size:13px}th:first-child,td:first-child{position:sticky;left:0;min-width:185px;max-width:185px;background:white;z-index:1;text-align:left}thead th:first-child{z-index:3;background:var(--paper)}.you td{background:#f2f7f8}.you td:first-child{background:#f2f7f8}.person b{display:block;font-size:19px}.person small{font-size:11px;color:#536a70}.rank{font-size:11px;color:#718e97;letter-spacing:.08em}.ring{width:90px;height:90px;margin:auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--score)*1%),#e9ecec 0)}.ring span{border-radius:50%;background:white;width:72px;height:72px;display:grid;place-content:center;font-size:23px;color:#5b93a1;font-weight:700}.mark{font-size:40px;line-height:1.2;font-weight:700}.m4{color:#7aa7ce}.m3{color:#9ec6e7}.m2{color:#838b8b}.m1{color:#d9958d}.m0{color:#ce736c}.mn{color:#ccd0d0}.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:13px}.legend .mark{font-size:24px;vertical-align:middle}details{border-top:1px solid var(--line);margin-top:25px;padding-top:18px}summary{cursor:pointer;font-weight:700}.candidate-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.candidate-card{border:1px solid var(--line);padding:18px;border-radius:12px}.candidate-card h3{margin-bottom:2px}.candidate-card p{font-size:13px;margin:8px 0}.budget{display:flex;height:8px;border-radius:4px;overflow:hidden;margin:12px 0}.budget span:nth-child(1){background:#86acbf}.budget span:nth-child(2){background:#a9bda1}.budget span:nth-child(3){background:#d5bb90}.budget span:nth-child(4){background:#b1a3bd}.budget span:nth-child(5){background:#929fa2}footer{text-align:center;font-size:12px;color:#6d7f83;padding:25px;border-top:1px solid var(--line)}.notice{font-size:13px;background:#f4f3ee;border-left:3px solid #a8a38d;padding:13px 16px;margin:20px 0}.error{color:#a4423b;font-size:14px}button:disabled{opacity:.4;cursor:not-allowed}.editor select{max-width:120px;padding:8px}#status{min-height:22px;font-size:13px;color:#527581}@media(max-width:560px){header{padding:13px 17px}header strong{font-size:15px}.tag{font-size:10px}main{padding:24px 18px 45px}.hero{padding-top:20px}.twocol{gap:19px}.point p{font-size:13px}.point h3{font-size:16px}.choice{font-size:16px;min-height:77px}.choices{gap:9px}.candidate-grid{grid-template-columns:1fr}th:first-child,td:first-child{min-width:138px;max-width:138px;padding:12px 10px}.person b{font-size:16px}th,td{min-width:105px;padding:15px 10px}.stats{gap:22px}.question{margin-bottom:22px}}@media print{header,footer,.actions,details,.notice{display:none}.tablewrap{max-height:none;overflow:visible}table{font-size:8px}th,td,th:first-child,td:first-child{min-width:0!important;position:static!important;padding:5px}.mark{font-size:20px}.ring{width:48px;height:48px}.ring span{width:40px;height:40px;font-size:13px}main{max-width:none;padding:0}}
</style></head><body><header><strong>前岡島 <span style="color:var(--accent)">投票マッチング</span></strong><span class="tag">模擬選挙 / 学習用</span></header><main id="app"></main><footer>限られた予算で、どんな島にしたい？</footer><script>
const questions=[
['学校を整える','子どもが減っていても、学校を直すお金を優先して使うべきですか？','島では子どもが減っています。学校の教室やトイレを直すにも、お金が必要です。','子どもが安心して学べる学校になります。','病院や道路などに使えるお金が減ります。'],
['給食費・教材費','ほかの事業に使うお金を減らしてでも、給食費や教材費を税金で安くすべきですか？','家庭の負担を減らす方法の一つが、給食費や教材費への補助です。','子育て家庭が支払うお金を減らせます。','学校の修理など、ほかの事業に回すお金が減ります。'],
['医療と介護','1億円の半分を、医療や介護のために使うことに賛成ですか？','高齢者が多い島です。医師の確保や、介護の支援にもお金がかかります。','病気や介護の支援を受けやすくする取り組みが進みます。','ほかの4分野は、残りの5000万円でまかないます。'],
['通院と見守り','病院の設備を新しくするより、通院の送迎や高齢者の見守りを優先すべきですか？','医療・福祉の予算を、施設と暮らしの支援のどちらに多く使うかを考えます。','車を使えない人や、一人暮らしの人を支えられます。','病院の設備を新しくする時期が遅れる場合があります。'],
['働く場所を増やす','ほかの予算を減らしてでも、会社や工場を呼ぶために5000万円を使うべきですか？','島には働く場所が少ないという課題があります。企業を呼ぶための施設などを整えます。','会社が来れば、島で働ける場所が増えると期待できます。','お金をかけても、会社が来るとは限りません。'],
['地元の店や工場','新しい会社を呼ぶより、今ある店や工場を支えることを優先すべきですか？','地元の事業を続けるため、設備の更新や、仕事を引き継ぐ人の育成を支えます。','今ある仕事や技術を守ることにつながります。','新しい会社を呼ぶために使えるお金が減ります。'],
['観光を元気にする','道路などの整備が後回しになっても、観光施設やイベントに多くのお金を使うべきですか？','島に来る観光客が減っています。観光施設やイベントで、人を呼び込む案です。','観光客が増えれば、島のお店の売上増加が期待できます。','島民が毎日使う施設の整備が遅れる場合があります。'],
['地域のバス','乗る人が少なくても、税金を使って地域のバスを残すべきですか？','ここでは、運賃収入だけでは運行費が足りないバスがあると考えます。','車を使えない人も、通院や買い物に行きやすくなります。','毎年、運行を支えるためのお金が必要です。'],
['道路と防災','新しい観光施設を作るより、古い道路や橋を直し、災害に備えるべきですか？','島では道路や交通が古くなっています。修理や防災設備の整備も必要です。','毎日の移動を支え、事故や災害の被害を減らすことにつながります。','観光客を増やすための新しい取り組みに使えるお金が減ります。'],
['予算の分け方','1億円は、5つの分野に2000万円ずつ、同じ金額を配るべきですか？','教育、医療・福祉、商業・工業、文化・観光、道路・交通の5分野に分けます。','すべての分野で、一定の取り組みを進められます。','特に困っている分野へ、お金を集中させにくくなります。']];
const candidates=[
{name:'高橋 翔太',kana:'たかはし しょうた',policy:'子どもたちの未来をつくる教育改革',budget:[5000,500,500,3000,1000],a:[4,4,0,2,0,2,3,2,1,0]},
{name:'佐藤 美咲',kana:'さとう みさき',policy:'安心して暮らせる医療・福祉の国へ',budget:[3000,5000,500,500,1000],a:[3,3,4,3,0,2,0,3,2,0]},
{name:'中村 健吾',kana:'なかむら けんご',policy:'ものづくりで経済を立て直す',budget:[3000,0,5000,0,2000],a:[3,2,0,2,4,1,0,2,3,0]},
{name:'石川 大輔',kana:'いしかわ だいすけ',policy:'安心・安全な暮らしを取り戻す',budget:[1000,3000,500,500,5000],a:[1,1,3,2,0,2,0,4,4,0]},
{name:'小林 彩乃',kana:'こばやし あやの',policy:'文化の力で、この国を元気に',budget:[3000,500,1000,5000,500],a:[3,2,0,2,1,3,4,2,0,0]},
{name:'九条 光一郎',kana:'くじょう こういちろう',policy:'実績ある一族だからこそできる国づくり',budget:[2000,2000,2000,2000,2000],a:[2,2,0,2,0,2,2,2,2,4]}];
const labels=['反対','やや反対','中立','やや賛成','賛成'],symbols=['×','△','◇','○','◎'],fields=['教育','医療・福祉','商業・工業','文化・観光','道路・交通'];
let answers=Array(10).fill(null),important=[],step=0,mode='home',editing=false;
const app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function mark(v){return `<span class="mark m${v===null?'n':v}" role="img" aria-label="${v===null?'無回答':labels[v]}">${v===null?'−':symbols[v]}</span>`;}
function score(a,b,priority){let sum=0,total=0;for(let i=0;i<10;i++){if(a[i]===null||b[i]===null)continue;const w=priority.includes(i)?2:1;sum+=(1-Math.abs(a[i]-b[i])/4)*w;total+=w;}return total?Math.round(100*sum/total):null;}
function rankings(){return candidates.map((c,i)=>({...c,id:i,score:score(answers,c.a,important)})).sort((a,b)=>(b.score??-1)-(a.score??-1));}
function go(m){mode=m;render();window.scrollTo(0,0);app.focus({preventScroll:true});}
app.tabIndex=-1;
function cards(){return candidates.map(c=>`<article class="candidate-card"><h3>${c.name}</h3><small>${c.kana}</small><p>${c.policy}</p><div class="budget" aria-hidden="true">${c.budget.map(n=>`<span style="width:${n/100}%"></span>`).join('')}</div><p>${fields.map((f,i)=>`${f} ${c.budget[i]}万円`).join(' ／ ')}</p></article>`).join('');}
function home(){return `<section class="hero"><div class="eyebrow">MAEOKA ISLAND / VOTE MATCH</div><h1>1億円で、<br>どんな島にしよう。</h1><p>学校、医療、仕事、観光、道路。<br>あなたの考えに近い候補者を、10の質問で比べます。</p><div class="stats"><div><strong>10<span>問</span></strong><span>身近な暮らしの質問</span></div><div><strong>6<span>人</span></strong><span>模擬選挙の候補者</span></div><div><strong>約3<span>分</span></strong><span>考えながら回答</span></div></div><div class="actions"><button class="primary" data-action="start">考えてみる →</button></div></section><section class="rule"><h3>前岡島の今</h3><p>子どもが減っている ／ 高齢者が多い ／ 働く場所が少ない ／ 観光客が減っている ／ 道路や交通が古くなっている</p><p style="margin:0">使える特別予算は<strong>1億円</strong>。全部を十分にはできないから、何を大切にするかを考えます。</p></section><div class="notice">架空の島を舞台にした学習用アプリです。候補者の予算配分は提供資料に基づき、各質問への5段階回答は教材用の仮設定です。実際に候補者が回答したものではありません。</div><details><summary>6人の候補者と予算を見る</summary><div class="candidate-grid" style="margin-top:18px">${cards()}</div><p class="muted">資料の円グラフの数字を万円として整理しています。中村健吾の図に記載のない2分野は、記載額の合計が1億円になるため0万円として表示しています。</p></details>`;}
function question(){const q=questions[step];return `<div class="progress"><b>Q${String(step+1).padStart(2,'0')} <small>/ 10</small></b><div class="track"><i style="width:${(step+1)*10}%"></i></div></div><div class="topic">${q[0]}</div><h2 class="question">${q[1]}</h2><p class="context">${q[2]}</p><div class="choices">${[4,3,2,1,0].map(v=>`<button class="choice" data-v="${v}" aria-pressed="${answers[step]===v}">${labels[v]}</button>`).join('')}</div><p class="muted" style="text-align:center">選ぶと次の質問に進みます。答えは後から変えられます。</p><div class="twocol"><section class="point"><h3>＋ メリット</h3><p>${q[3]}</p></section><section class="point"><h3>− デメリット</h3><p>${q[4]}</p></section></div><div class="nav"><button class="plain" data-action="back">‹ ${step?'前の質問':'トップ'}</button><button class="plain" data-action="skip">わからない・回答しない →</button></div>`;}
function priorities(){return `<div class="eyebrow">最後に / 大切にしたいこと</div><h2 style="margin-top:15px">特に大切だと思うものを<br>3つ選んでください。</h2><p class="muted">選んだ質問は、マッチング計算で2倍の重みをつけます。</p><div>${questions.map((q,i)=>`<label class="checkrow"><input type="checkbox" data-priority="${i}" ${important.includes(i)?'checked':''} ${important.length===3&&!important.includes(i)?'disabled':''}><b>Q${String(i+1).padStart(2,'0')}</b><span>${q[0]}</span></label>`).join('')}</div><div class="actions"><button class="secondary" data-action="last">回答を見直す</button><button class="primary" data-action="result" ${important.length!==3?'disabled':''}>結果を見る（${important.length}/3） →</button></div>`;}
function results(){let rows=rankings();return `<section class="result-title"><div class="eyebrow">YOUR MATCHING RESULT</div><h1>投票マッチング結果</h1><p>あなたの考えと、候補者の考えを比べよう。</p></section><div class="notice">候補者の回答は教材用の仮設定です。数値は投票先の正解を示すものではありません。予算配分や、違いのある質問も見て判断しましょう。</div>${answers.every(a=>a===null)?'<p class="error">回答がないため、マッチング率は計算できません。回答を見直してください。</p>':''}<p class="muted">← 表を横に動かすと、10問すべてを比較できます。★ は重視した質問。</p><div class="tablewrap"><table><thead><tr><th>候補者</th><th>マッチング率</th>${questions.map((q,i)=>`<th>Q${i+1} ${important.includes(i)?'★':''}<br>${q[1]}</th>`).join('')}</tr></thead><tbody><tr class="you"><td><strong>あなたの回答</strong></td><td>—</td>${answers.map(a=>`<td>${mark(a)}</td>`).join('')}</tr>${rows.map((c,i)=>`<tr><td class="person"><span class="rank">${c.score===null?'':`${1+rows.filter(r=>r.score>c.score).length}位`}</span><b>${c.name}</b><small>${c.kana}</small></td><td>${c.score===null?'算出不可':`<div class="ring" style="--score:${c.score}"><span>${c.score}%</span></div>`}</td>${c.a.map(a=>`<td>${mark(a)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="legend">${[4,3,2,1,0,null].map(v=>`<span>${mark(v)} ${v===null?'無回答':labels[v]}</span>`).join('')}</div><div class="actions"><button class="primary" data-action="download">結果を保存する</button><button class="secondary" data-action="review">回答を見直す</button><button class="plain" data-action="restart">最初からやり直す</button></div><p id="status" role="status"></p><details><summary>マッチング率の計算方法</summary><p class="muted">回答を「反対＝0」から「賛成＝4」の5段階にします。候補者と同じ回答は100点、1段階違いは75点、2段階は50点、3段階は25点、4段階は0点。重視した3問は2倍にして平均し、整数に四捨五入します。どちらかが無回答の質問は計算から除きます。同率は同順位です。</p></details><details><summary>候補者の政策・予算を確認する</summary><div class="candidate-grid" style="margin-top:18px">${cards()}</div></details><details><summary>授業用設定：候補者の回答を変更</summary><p class="muted">初期値は、政策を参考に作った仮設定です。支出が少ないことだけを「反対」の根拠にはしていません。資料で確認できない優先順位も含みます。授業の設定に合わせて変更してください。変更はこのページを開いている間だけ有効です。</p><div class="tablewrap editor"><table><thead><tr><th>候補者</th>${questions.map((q,i)=>`<th>Q${i+1}<br>${q[0]}</th>`).join('')}</tr></thead><tbody>${candidates.map((c,ci)=>`<tr><td>${c.name}</td>${c.a.map((a,qi)=>`<td><select aria-label="${c.name} Q${qi+1}" data-candidate="${ci}" data-question="${qi}">${[4,3,2,1,0,null].map(v=>`<option value="${v===null?'null':v}" ${a===v?'selected':''}>${v===null?'無回答':labels[v]}</option>`).join('')}</select></td>`).join('')}</tr>`).join('')}</tbody></table></div><button class="secondary" data-action="apply">変更を結果に反映</button></details>`;}
function render(){app.innerHTML=mode==='home'?home():mode==='question'?question():mode==='priorities'?priorities():results();}
function advance(v){answers[step]=v;if(step<9){step++;go('question');}else go('priorities');}
app.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.v!==undefined){advance(Number(b.dataset.v));return;}switch(b.dataset.action){case'start':step=0;go('question');break;case'back':if(step){step--;go('question');}else go('home');break;case'skip':advance(null);break;case'last':step=9;go('question');break;case'result':if(important.length===3)go('results');break;case'review':step=0;go('question');break;case'restart':if(confirm('回答を消して、最初からやり直しますか？')){answers=Array(10).fill(null);important=[];step=0;go('home');}break;case'download':download();break;case'apply':go('results');break;}});
app.addEventListener('change',e=>{if(e.target.dataset.priority!==undefined){const i=Number(e.target.dataset.priority);if(e.target.checked&&important.length<3)important.push(i);else important=important.filter(x=>x!==i);const y=window.scrollY;render();window.scrollTo(0,y);}if(e.target.dataset.candidate!==undefined)candidates[Number(e.target.dataset.candidate)].a[Number(e.target.dataset.question)]=e.target.value==='null'?null:Number(e.target.value);});
function download(){const text=['前岡島 投票マッチング結果','候補者の回答は教材用の仮設定です。','',...rankings().map(c=>`${c.name}：${c.score===null?'算出不可':c.score+'%'}`),'','あなたの回答',...questions.map((q,i)=>`Q${i+1} ${q[1]}\n${answers[i]===null?'無回答':labels[answers[i]]}${important.includes(i)?'【重視】':''}`),'','候補者の回答（計算時の設定）',...candidates.map(c=>`${c.name}：${c.a.map((a,i)=>`Q${i+1} ${a===null?'無回答':labels[a]}`).join(' ／ ')}`),'','計算：一致100点、1段階違い75点、2段階50点、3段階25点、4段階0点。重視した質問は2倍。無回答は除外。'].join('\n');const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='前岡島_マッチング結果.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('status').textContent='保存用のテキストファイルを作成しました。';}
render();
</script></body></html>
