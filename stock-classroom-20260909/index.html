:root{color-scheme:light;--ink:#152842;--blue:#245bdb;--line:#d9e2ee;--bg:#f0f4fa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,'Noto Sans JP',sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:12px 18px;font-weight:700;background:var(--blue);color:white;min-height:46px}button:hover{filter:brightness(.92)}button:disabled{opacity:.4;cursor:default}button.alt{background:#e7edfa;color:var(--ink)}button.sell{background:#fff0e9;color:#974118}input,select{border:1px solid #b9c8dd;border-radius:8px;padding:10px;width:100%;background:white;color:var(--ink)}:focus-visible{outline:3px solid #e4a616;outline-offset:3px}header{background:#112640;color:white;padding:18px 24px}header div{max-width:1060px;margin:auto;display:flex;justify-content:space-between;gap:12px;align-items:center}header b{letter-spacing:.06em}header span{font-size:14px;color:#c8d6ed}main{max-width:1100px;margin:32px auto;padding:0 20px 45px}h1{font-size:clamp(26px,4vw,42px);line-height:1.4;margin:10px 0 18px;letter-spacing:-.03em}h2{font-size:23px;margin:0 0 15px}h3{font-size:18px;margin:0}p{margin:8px 0 18px}.muted{color:#5c6e84}.eyebrow{font-size:14px;font-weight:800;color:var(--blue);letter-spacing:.12em}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:20px}.modes{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:28px 0}.mode{padding:30px;position:relative;overflow:hidden}.mode strong{display:block;font-size:34px;margin:15px 0}.mode button{width:100%;margin-top:16px}.mode.primary{background:#153a72;color:white;border:0}.mode.primary .muted{color:#ccd9ee}.mode.primary button{background:#d6ed71;color:#16310c}.pill{display:inline-block;font-size:14px;padding:3px 10px;border-radius:20px;background:#e9effb;color:#2a4b88}.steps{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.step{font-size:14px;padding:6px 10px;background:#e4eaf3;border-radius:8px}.step.on{background:#245bdb;color:#fff}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:16px 20px;background:white;border:1px solid var(--line);border-radius:12px}.stat span{display:block;font-size:14px;color:#53657a}.stat b{font-size:clamp(19px,3vw,28px);font-variant-numeric:tabular-nums}.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.news{background:#fff7d9;border-left:5px solid #e0a723;padding:18px;margin:12px 0;border-radius:8px}.news p{margin:6px 0 0}.market{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.company{border:1px solid var(--line);border-radius:12px;background:white;padding:18px;min-width:0}.company h3{overflow-wrap:anywhere}.price{font-size:25px;font-weight:800;margin:10px 0 0;font-variant-numeric:tabular-nums}.company small{font-size:14px;color:#607089}.trade{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.company label{font-size:14px;display:block;margin-top:10px}.company input{margin-top:4px}.up{color:#16754f}.down{color:#b5422e}.footer-action{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-top:24px}.search{margin:22px 0}.search summary{cursor:pointer;font-weight:700}.search input{margin:10px 0}.holding{border-bottom:1px solid var(--line);padding:10px 0}.result-amount{font-size:clamp(32px,7vw,56px);font-weight:900;margin:10px 0}.notice{font-size:14px;color:#607089;margin-top:24px}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#112640;color:white;padding:12px 22px;border-radius:10px;z-index:5;max-width:92vw;box-shadow:0 8px 30px #11264033}#toast:empty{display:none}.result-line{display:grid;grid-template-columns:1fr auto;gap:12px;border-bottom:1px solid var(--line);padding:15px 0}.result-line p{grid-column:1/-1;font-size:14px;margin:0}.chart{height:100px;display:flex;gap:10px;align-items:flex-end;margin-top:15px}.bar{flex:1;background:#a7c5ff;min-height:4px;border-radius:6px 6px 0 0;position:relative}.bar span{position:absolute;bottom:100%;width:100%;text-align:center;font-size:12px}dialog{border:1px solid var(--line);border-radius:16px;width:min(460px,90vw);color:var(--ink);padding:24px}dialog::backdrop{background:#10254088}dialog button{margin-top:16px} @media(max-width:700px){main{margin:20px auto;padding:0 14px 30px}.market{grid-template-columns:1fr 1fr}.modes{grid-template-columns:1fr}.panel{padding:18px}.stats{gap:6px}.stat{padding:12px 8px}.stat span{font-size:12px}.stat b{font-size:18px}.row{align-items:flex-start}.footer-action{align-items:stretch;flex-direction:column}header{padding:14px}.mode{padding:24px}}@media(max-width:390px){.market{grid-template-columns:1fr}.stat b{font-size:16px}}@media(prefers-reduced-motion:no-preference){.panel,.company{animation:appear .2s ease-out}@keyframes appear{from{opacity:.5;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
</style></head><body><header><div><b>株式売買ゲーム</b><span>ニュースを読んで、未来を予測。</span></div></header><main id="app"></main><div id="toast" role="status" aria-live="polite"></div><dialog id="reset"><h2>ゲームを終了しますか？</h2><p>ここまでの記録は消えます。</p><button onclick="document.querySelector('#reset').close()" class="alt">続ける</button> <button onclick="location.reload()">終了する</button></dialog><script>
const sectors={game:['ゲーム・娯楽','任天堂,ソニーグループ,カプコン,コナミグループ,バンダイナムコホールディングス,セガサミーホールディングス,スクウェア・エニックス・ホールディングス,コーエーテクモホールディングス,ガンホー・オンライン・エンターテイメント,サンリオ'],food:['食品・飲料','日本マクドナルドホールディングス,日本コカ・コーラ,サントリー食品インターナショナル,伊藤園,アサヒグループホールディングス,キリンホールディングス,サッポロホールディングス,味の素,日清食品ホールディングス,明治ホールディングス,森永製菓,江崎グリコ,カルビー,キッコーマン,山崎製パン,ヤクルト本社'],tech:['電子機器・半導体','Apple,Microsoft,NVIDIA,Intel,AMD,Qualcomm,TSMC,ソシオネクスト,ルネサスエレクトロニクス,東京エレクトロン,アドバンテスト,SCREENホールディングス,レーザーテック,ローム,村田製作所,TDK,京セラ,シャープ,パナソニック ホールディングス,富士通,NEC,日立製作所'],car:['自動車','トヨタ自動車,本田技研工業,日産自動車,マツダ,SUBARU,スズキ,三菱自動車工業,いすゞ自動車,Tesla,デンソー,ブリヂストン,横浜ゴム'],travel:['旅行・交通','ANAホールディングス,日本航空,東日本旅客鉄道,東海旅客鉄道,西日本旅客鉄道,九州旅客鉄道,近鉄グループホールディングス,阪急阪神ホールディングス,南海電気鉄道,京阪ホールディングス,京成電鉄,東武鉄道,HIS,オリエンタルランド'],retail:['小売・外食','ファーストリテイリング,良品計画,しまむら,イオン,セブン＆アイ・ホールディングス,ニトリホールディングス,ビックカメラ,ヤマダホールディングス,エディオン,ドン・キホーテ（PPIH）,ZOZO,楽天グループ,Amazon,ゼンショーホールディングス,すかいらーくホールディングス,コメダホールディングス,モスフードサービス,くら寿司,スシロー（FOOD & LIFE COMPANIES）'],energy:['電力・資源','東京電力ホールディングス,関西電力,中部電力,九州電力,東北電力,北海道電力,中国電力,四国電力,北陸電力,ENEOSホールディングス,出光興産,INPEX,コスモエネルギーホールディングス'],net:['通信・ネット','NTT,KDDI,ソフトバンク,ソフトバンクグループ,Alphabet,Meta Platforms,LINEヤフー,サイバーエージェント,DeNA,GMOインターネットグループ'],other:['その他','武田薬品工業,アステラス製薬,第一三共,中外製薬,エーザイ,大塚ホールディングス,花王,資生堂,ユニ・チャーム,ライオン,TOTO,LIXIL,大和ハウス工業,積水ハウス,三井不動産,三菱地所']};
let all=Object.entries(sectors).flatMap(([sector,[label,names]])=>names.split(',').map(name=>({name,sector}))).map((c,id)=>({...c,id,base:600+(id*347)%7400}));
const practiceIds=[0,10,11];const lessons=[
{title:'歴史的な猛暑。冷たい飲み物が売り切れ続出',text:'飲料の注文が急増。一方、暑さで外出を控える人が増え、観光地の来場者が減っています。',rates:{food:14,travel:-10,game:5},why:{food:'飲料などの販売増で、食品・飲料会社の利益が増えると予想された。',travel:'外出を控える人が増え、旅行や施設の利用が減ると予想された。',game:'家で過ごす時間が増え、ゲームの利用が増えると予想された。'}},
{title:'ゲームの世界大会が大人気。関連商品の注文が急増',text:'配信を見た人の間でゲームやゲーム機が人気に。高性能な部品の注文も増えています。',rates:{game:18,tech:10},why:{game:'ゲームや関連商品が売れ、利益が増えると予想された。',tech:'ゲーム機やパソコン向けの部品の需要が増えると予想された。'}},
{title:'小麦や食用油が値上がり。販売価格は据え置き',text:'食品会社や飲食店の材料費が増加。当面はお客さんへの値上げを見送る方針です。',rates:{food:-13,retail:-7},why:{food:'材料費が増えても販売価格は変わらず、手元に残る利益が減ると予想された。',retail:'外食などで仕入れの負担が増え、利益が減ると予想された。'}},
{title:'新型AIスマホが人気。電子部品の注文が急増',text:'新しいスマホへの買い替えが進み、電子機器や半導体の工場が生産を増やしています。',rates:{tech:17,net:6},why:{tech:'スマホや半導体の販売が増え、利益が増えると予想された。',net:'新しいスマホで通信やネットサービスの利用が増えると予想された。'}},
{title:'原油が急騰。燃料代の負担が増加',text:'航空会社や発電会社の燃料代が上昇。資源会社は原油を高く売れるようになりました。',rates:{travel:-12,car:-7,energy:0},why:{travel:'航空会社などの燃料代が増え、利益を押し下げると予想された。',car:'ガソリン代の上昇が車の購入をためらう理由になると予想された。',energy:'石油関連会社には販売価格の上昇、電力会社には燃料費の上昇が影響した。'}}
];
let s=null;let searchText='';const app=document.querySelector('#app');const yen=n=>n.toLocaleString('ja-JP')+'円';const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let toastTimer;function toast(t){document.querySelector('#toast').textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.querySelector('#toast').textContent='',3000)}
function home(){app.innerHTML=`<div class="eyebrow">CLASSROOM STOCK GAME</div><h1>ニュースを読んで、<br>どの会社の株を買う？</h1><p class="muted">株式売買ゲームへようこそ。練習用と本番用、どちらのモードで遊びますか？</p><div class="modes"><section class="panel mode"><span class="pill">まずはここから</span><h2 style="margin-top:18px">練習用</h2><strong>100万円</strong><p>3ターン・約3分<br>任天堂／マクドナルド／コカ・コーラ</p><button onclick="start('practice')">練習を始める</button></section><section class="panel mode primary"><span class="pill">予測に挑戦</span><h2 style="margin-top:18px">本番用</h2><strong>10万円</strong><p>5ターン・約5分<br>${all.length}社から選択。注目の6社を毎回表示</p><button onclick="start('main')">本番を始める</button></section></div><div class="panel"><h3>遊び方</h3><div class="steps"><span class="step">1 現在の株価</span><span class="step">2 ニュース</span><span class="step">3 売買</span><span class="step">4 値動きと理由</span></div><p>1株から買えます。買わずに待つのも選択肢。最後に持っている株をすべて売り、最終金額を比べます。</p></div><p class="notice">授業用のシミュレーションです。企業名は実在しますが、ニュース・株価・値動きは架空です。実際の売買条件とは異なり、税金や手数料は省略しています。現実の株価はニュースどおりに動くとは限りません。</p>`}
function start(mode){s={mode,turn:0,max:mode==='practice'?3:5,initial:mode==='practice'?1000000:100000,cash:mode==='practice'?1000000:100000,prices:Object.fromEntries(all.map(c=>[c.id,c.base])),hold:{},phase:'price',history:[],changes:[],extra:[],orders:0};searchText='';render();window.scrollTo(0,0)}
function companies(){return s.mode==='practice'?all.filter(c=>practiceIds.includes(c.id)):all}function event(){return lessons[s.turn]}function total(){return s.cash+Object.entries(s.hold).reduce((a,[id,q])=>a+q*s.prices[id],0)}function focusIds(){if(s.mode==='practice')return practiceIds;let affected=all.filter(c=>Object.hasOwn(event().rates,c.sector));let picks=affected.filter((_,i)=>i%Math.max(1,Math.floor(affected.length/4))===0).slice(0,4);let rest=all.filter(c=>!picks.includes(c)&&c.id%17===s.turn).slice(0,6-picks.length);return [...picks,...rest].slice(0,6).map(c=>c.id)}
function card(c){let q=s.hold[c.id]||0;return `<article class="company"><small>${esc(sectors[c.sector][0])}</small><h3>${esc(c.name)}</h3><div class="price">${yen(s.prices[c.id])}</div><small>持っている株：${q}株</small>${s.phase==='trade'?`<label>売買する株数<input id="qty-${c.id}" type="number" inputmode="numeric" value="1" min="1" max="1000000" step="1"></label><div class="trade"><button onclick="trade(${c.id},1)" ${s.cash<s.prices[c.id]?'disabled':''}>買う</button><button class="sell" onclick="trade(${c.id},-1)" ${!q?'disabled':''}>売る</button></div><button class="alt" style="width:100%;padding:6px;margin-top:8px;font-size:14px" onclick="maxQty(${c.id})">買える株数を入力</button>`:''}</article>`}
function render(){let diff=total()-s.initial;app.innerHTML=`<div class="row"><div><div class="eyebrow">${s.mode==='practice'?'練習用':'本番用'} · TURN ${s.turn+1} / ${s.max}</div><h1 style="font-size:28px;margin-bottom:8px">${['price','trade','change','done'].includes(s.phase)?({price:'まず、現在の株価を確認',trade:'ニュースをヒントに売買しよう',change:'予測は当たった？',done:'今回の結果'})[s.phase]:''}</h1></div><button class="alt" onclick="document.querySelector('#reset').showModal()">終了</button></div><div class="steps">${['現在の株価','ニュース・売買','株価変動'].map((n,i)=>`<span class="step ${['price','trade','change'][i]===s.phase?'on':''}">${i+1} ${n}</span>`).join('')}</div><div class="stats"><div class="stat"><span>使えるお金</span><b>${yen(s.cash)}</b></div><div class="stat"><span>株を含む合計</span><b>${yen(total())}</b></div><div class="stat"><span>最初との差</span><b class="${diff>=0?'up':'down'}">${diff>0?'+':''}${yen(diff)}</b></div></div><div id="surface" style="margin-top:24px"></div><p class="notice">株価とニュースは架空です。1株単位・手数料なし。${s.mode==='main'?'海外企業もゲーム内では円で表示します。':''}目安は1ターン約1分。自分のペースで進められます。</p>`;
let surface=document.querySelector('#surface');if(s.phase==='done'){finishView(surface);return}if(s.phase==='change'){surface.innerHTML=`<div class="panel"><h2>値動きとその理由</h2>${s.changes.map(c=>`<div class="result-line"><b>${esc(c.name)}</b><b class="${c.rate>=0?'up':'down'}">${c.rate>0?'+':''}${c.rate}%</b><p>${yen(c.old)} → ${yen(c.next)}　${esc(c.why)}</p></div>`).join('')}</div><div class="footer-action"><span>株を持っている間は、値下がりするリスクもあります。</span><button onclick="nextTurn()">${s.turn+1===s.max?'すべて売って結果を見る':'次のターンへ'} →</button></div>`;return}
let ids=[...new Set([...focusIds(),...Object.keys(s.hold).filter(id=>s.hold[id]>0).map(Number),...s.extra])];surface.innerHTML=`${s.phase==='trade'?`<section class="news"><span class="eyebrow">NEWS ${s.turn+1}</span><h2 style="margin:4px 0">${event().title}</h2><p>${event().text}</p></section><p class="muted">売買は何回でもできます。注文すると、その場でお金と株数に反映されます。</p>`:'<p class="muted">ニュースを見る前の株価です。購入は次の画面で行います。</p>'}<div class="row" style="margin:20px 0 12px"><h2 style="margin:0">${s.mode==='practice'?'3社の株価':'注目の6社・保有中の株'}</h2><span class="pill">1株の価格</span></div><div class="market">${ids.map(id=>card(all[id])).join('')}</div>${s.mode==='main'?`<details class="panel search"><summary>ほかの企業を探す（${all.length}社）</summary><label for="search">企業名で検索</label><input id="search" type="search" placeholder="例：トヨタ、Apple" oninput="searchCompanies(this.value)"><div id="search-results"></div><details style="margin-top:16px"><summary>一覧にない実在企業を追加する</summary><p class="muted">企業名と主な事業を指定してください。実在・上場の確認は自動では行いません。授業用に業種で値動きを設定します。</p><label for="new-name">企業名</label><input id="new-name" maxlength="60" placeholder="実在する企業の名前"><label for="new-sector">主な事業</label><select id="new-sector">${Object.entries(sectors).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select><button style="margin-top:12px" onclick="addCompany()">追加して表示</button></details></details>`:''}<div class="footer-action"><span>${s.phase==='price'?'次は、このターンのニュースが届きます。':'売買しないまま進むこともできます。'}</span><button onclick="${s.phase==='price'?"s.phase='trade';render();window.scrollTo(0,0)":"resolveTurn()"}">${s.phase==='price'?'ニュースを読む':'売買を終えて株価を見る'} →</button></div>`}
function searchCompanies(t){searchText=t;let found=companies().filter(c=>c.name.toLowerCase().includes(t.trim().toLowerCase()));document.querySelector('#search-results').innerHTML=t.trim()?`<p>${found.length}社見つかりました</p><div class="market">${found.slice(0,12).map(c=>`<div class="company"><h3>${esc(c.name)}</h3><p>${yen(s.prices[c.id])}</p><button class="alt" onclick="addFocus(${c.id})">一覧に表示</button></div>`).join('')}</div>${found.length>12?'<p>企業名を詳しく入力して絞り込んでください。</p>':''}`:'<p class="muted">企業名の一部を入力してください。</p>'}
function addFocus(id){if(!s.extra.includes(id))s.extra.push(id);render();toast('企業を一覧に追加しました')}function addCompany(){let name=document.querySelector('#new-name').value.trim(),sector=document.querySelector('#new-sector').value;if(!name)return toast('企業名を入力してください');let c=all.find(c=>c.name.toLowerCase()===name.toLowerCase());if(!c){c={id:all.length,name,sector,base:2000};all.push(c);s.prices[c.id]=2000;}addFocus(c.id)}function maxQty(id){document.querySelector('#qty-'+id).value=Math.floor(s.cash/s.prices[id])}
function trade(id,dir){if(s.phase!=='trade')return;let q=Number(document.querySelector('#qty-'+id).value);if(!Number.isSafeInteger(q)||q<1||q>1000000)return toast('株数は1〜100万の整数で入力してください');let cost=q*s.prices[id];if(dir===1&&cost>s.cash)return toast('使えるお金が足りません');if(dir===-1&&q>(s.hold[id]||0))return toast('持っている株数を超えています');s.cash-=cost*dir;s.hold[id]=(s.hold[id]||0)+q*dir;s.orders++;render();toast(`${all[id].name}を${q}株${dir===1?'購入':'売却'}しました`)}
function movement(c){let rate=event().rates[c.sector]||0;let why=event().why[c.sector]||'今回のニュースによる直接の影響は小さいとし、株価は変わらなかった。';if(s.turn===4&&c.sector==='energy'){rate=/電力/.test(c.name)?-11:14;why=rate>0?'原油を高く売れるため、石油関連事業の利益が増えると予想された。':'火力発電などの燃料費が増え、利益が減ると予想された。'}return {rate,why}}
function resolveTurn(){if(s.phase!=='trade')return;const show=new Set([...focusIds(),...s.extra,...Object.keys(s.hold).filter(id=>s.hold[id]>0).map(Number)]);s.changes=[];companies().forEach(c=>{let {rate,why}=movement(c);let old=s.prices[c.id],next=Math.max(1,Math.round(old*(1+rate/100)));s.prices[c.id]=next;if(show.has(c.id))s.changes.push({name:c.name,old,next,rate,why})});s.history.push(total());s.phase='change';render();window.scrollTo(0,0)}
function nextTurn(){if(s.phase!=='change')return;if(s.turn+1===s.max){s.cash=total();s.hold={};s.phase='done'}else{s.turn++;s.phase='price';s.extra=[]}render();window.scrollTo(0,0)}
function finishView(el){let diff=s.cash-s.initial,pct=diff/s.initial*100;el.innerHTML=`<section class="panel"><div class="eyebrow">FINAL RESULT</div><h2>最終的な所持金</h2><div class="result-amount">${yen(s.cash)}</div><p class="${diff>=0?'up':'down'}"><b>最初から ${diff>=0?'+':''}${yen(diff)}（${pct>=0?'+':''}${pct.toFixed(1)}%）</b></p><p>持っていた株はすべて最後の株価で売却しました。</p><div class="chart" aria-label="各ターン終了時の株を含む合計">${s.history.map((v,i)=>`<div class="bar" style="height:${v/Math.max(...s.history)*80}%"><span>${i+1}回目</span></div>`).join('')}</div><div style="margin-top:18px">${s.history.map((v,i)=>`<div class="holding row"><span>${i+1}ターン終了時</span><b>${yen(v)}</b></div>`).join('')}</div></section><section class="panel"><h2>自分の判断を振り返ろう</h2><p>${s.orders===0?'今回は株を買わず、現金を持ち続けました。値下がりを避けられる一方、値上がりの利益は得られません。':diff>0?'今回は資金を増やせました。利益が出た会社について、ニュースのどの部分が判断の手がかりだったか説明してみましょう。':diff<0?'今回は資金が減りました。買った理由と、その後のニュースを見直し、どこで判断を変えられたか考えてみましょう。':'今回は最初と同じ金額になりました。売買のタイミングや、現金で待つ判断にどんな意味があったか考えてみましょう。'}</p><ol><li>どのニュースを理由に、その会社を選んだ？</li><li>1社に集中した場合と、複数の会社に分けた場合で、結果はどう変わる？</li><li>現実には、同じニュースでも予想と違う値動きになるのはなぜ？</li></ol></section><div class="footer-action"><span>結果だけでなく、判断の理由も比べてみよう。</span><button onclick="s=null;home();window.scrollTo(0,0)">モード選択に戻る</button></div>`}home();
</script></body></html>
