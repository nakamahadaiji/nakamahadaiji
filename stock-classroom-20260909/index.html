Promise.all(['./history.json?v=3','./fx.json?v=1'].map(url=>fetch(url).then(r=>{if(!r.ok)throw Error();return r.json()}))).then(([d,f])=>{if(d.companies.length<6||d.dates.length<321||f.dates.length!==d.dates.length||!d.dates.every((date,i)=>date===f.dates[i]&&Number.isFinite(f.jpyPerUsd[i])&&f.jpyPerUsd[i]>0))throw Error();data=d;fx=f;home()}).catch(()=>{$('app').innerHTML='<h1>株価データを読み込めませんでした</h1><button onclick="location.reload()">もう一度読み込む</button>'});

const newsSets={"practice":[{"id":"p-results","at":60,"date":"2017-05-02","timing":"after","title":"スマホメーカー、売上が前年を上回る","body":"四半期の売上が前年の同じ時期より約5％増加。株を持つ人に利益を還元する計画も拡大した。","symbols":["AAPL"],"analysis":"売上の増加は好材料に見えますが、それだけで大きく上がるとは限りません。今回、発表後の最初の終値は小幅安で、円換算ではほぼ横ばいでした。期待の大きさや、ほかの情報も価格に関わります。","source":"https://www.apple.com/newsroom/2017/05/apple-reports-second-quarter-results/"}],"main":[{"id":"m-phone","at":60,"date":"2016-09-07","timing":"during","title":"新型スマホを発表。カメラと防水機能を強化","body":"大手メーカーが新型スマホを発表。電池の持ちも改善し、今月から販売する。","symbols":["AAPL"],"analysis":"新製品には販売が伸びる期待があります。ただし、発表日の株価は小幅高にとどまり、円換算ではほぼ横ばいでした。話題の大きさと、株価の変化の大きさは同じではありません。","source":"https://www.apple.com/newsroom/2016/09/apple-introduces-iphone-7-iphone-7-plus/"},{"id":"m-leader","at":120,"date":"2016-12-01","timing":"after","title":"大手カフェチェーン、長年のトップが交代へ","body":"会社を長く率いてきた経営トップが、来春に交代すると発表。後任は社内の幹部で、今のトップは新しい店舗づくりに専念する。","symbols":["SBUX"],"analysis":"会社を率いてきた人が役割を変えることで、今後の経営を心配する見方が出る可能性があります。発表後の最初の終値は下落しました。交代だけが下落の原因と断定することはできません。","source":"https://investor.starbucks.com/news/financial-releases/news-details/2016/Starbucks-Announces-New-Leadership-Structure-to-Drive-Next-Wave-of-Global-Growth/default.aspx"},{"id":"m-record","at":180,"date":"2017-01-31","timing":"after","title":"スマホの販売台数、過去最高に","body":"大手メーカーが年末を含む3か月の業績を発表。スマホの販売台数と会社全体の売上が、過去最高を更新した。","symbols":["AAPL"],"analysis":"商品がよく売れたという数字は、今後の利益への期待につながります。発表後の最初の終値も大きく上がりました。新製品の発表だけのニュースと、販売実績が確認できたニュースを比べてみましょう。","source":"https://www.apple.com/newsroom/2017/01/apple-reports-record-first-quarter-results/"},{"id":"m-grocery","at":240,"date":"2017-06-16","timing":"before","title":"ネット通販の大手、食品スーパーを買収へ","body":"ネット通販の大手が、米国を中心に460店以上を持つ食品スーパーを買収することで合意。食品の買い物にも、本格的に事業を広げる。","symbols":["AMZN","WMT","KR"],"analysis":"通販と実店舗を組み合わせる成長への期待が考えられます。一方、ほかのスーパーには競争が厳しくなる心配もあります。同じ日の終値では、買収する会社が上がり、ここに載せた競合2社は下がりました。","source":"https://press.aboutamazon.com/2017/6/amazon-to-acquire-whole-foods-market"}]};

function helpPanels(){return `<section class="help"><details><summary>ニュースのヒントについて</summary><div><p>練習用は開始1分後に1件。本番用は開始1・2・3・4分後に1件ずつ、計4件です。練習と本番では別の出来事を使っています。</p><p>当時の企業の発表を短く言い換えています。会社名や「上がる・下がる」の答えは出しません。すべての会社に関係するとは限らず、見送るのも作戦です。</p><p>発表後の値動きを先に見せないため、ニュースは発表後最初の終値を再生する直前に出します。取引時間中の発表は前日の終値、取引終了後の発表はその日の終値を表示しているときに届きます。これは授業用の時刻のまとめ方で、ニュースを見た瞬間に実際にその価格で取引できたという意味ではありません。</p><p>毎分の表示に合わせて区間ごとの日付の進み方を調整しています。同じ日を続けて表示したり、日付が飛ぶ場合があります。価格は当時の終値と為替から計算し、ニュースのために上げ下げする処理は加えていません。</p><p>終了後の「ニュースと値動きのふり返り」で、発表前後の変化、考えられる見方、元の発表を確認できます。ニュースだけが値動きの原因とは限りません。</p></div></details><details><summary>遊び方</summary><div><ol><li>練習用か本番用を選びます。</li><li>会社を選び、買う株数を1株から指定して「買う」を押します。株数は＋・−ボタンでも、数字の入力でも変更できます。売りたいときは「全部 売る」を押します。</li><li>終了すると持っている株をすべて売り、最終金額が出ます。</li></ol><p>1秒ごとに過去の終値を再生します。会社の選択中や説明を開いている間も進みます。</p><p>チャートの「買」は購入した位置、「売」は売却した位置です。「株を含む合計」は、持っている株を今すべて売った場合のお金も含みます。</p></div></details><details><summary>過去の株価と、円表示のしくみ</summary><div><p><b>過去の実際の株価と、その日の為替レートを使って円に換算しています。</b>為替レートとは「1ドルが何円か」という交換の割合です。</p><p><b>円での株価 ＝ ドルでの株価 × 1ドルあたりの円の金額</b></p><p>例えば、次のように変わります（説明用の仮の数字です）。</p><table><thead><tr><th>ドルの株価</th><th>1ドルの値段</th><th>円での株価</th></tr></thead><tbody><tr><td>100ドル</td><td>110円</td><td>11,000円</td></tr><tr><td>110ドル</td><td>110円</td><td>12,100円</td></tr><tr><td>110ドル</td><td>100円</td><td>11,000円</td></tr></tbody></table><p>ドルで株価が上がっても、1ドルを円に換えたときの金額が減ると、円での利益は小さくなります。つまり、<b>株価と円高・円安の両方</b>が結果に影響します。</p><p>以前の「開始時1,000円」は、実際の株価の上がり下がりの割合だけを再現する設定でした。現在はこの設定をやめ、円換算した価格を使うため、会社ごとに開始価格が異なります。</p></div></details><details><summary>データと計算の条件</summary><div><p>株価は${data.dates[0]}〜${data.dates.at(-1)}の米国株の終値（その日の取引が終わったときの価格）です。ニュースの発生日に合わせて、練習用・本番用それぞれの再生期間を固定しています。株価も為替も現在の価格ではありません。</p><p>為替は米国の中央銀行が公表する日次データを使用しています。その日の値がない場合は、直前に公表された日の値を使います。株価と為替の観測時刻は同一ではないため、その瞬間の実際の売買価格を完全に再現するものではありません。</p><p>使っていないお金は円のままです。購入時はその日の円換算価格で買い、売却時は売る日の円換算価格で円に戻します。購入できるのは1株単位です。使えるお金が足りない注文はできません。</p><p>円換算価格は小数第2位、購入・売却金額は1円単位に丸めます。税金・手数料・配当は省略しています。</p><p><a href="${data.source}" target="_blank" rel="noopener">株価データ：Plotly公開データ</a><br><a href="${fx.source}" target="_blank" rel="noopener">為替データ：米連邦準備制度 H.10</a></p></div></details></section>`}

function home(){clearInterval(clock);game=null;$('app').innerHTML=`<section class="home"><div class="tag">CHART GAME</div><h1>動くチャートを見て、<br>買う。売る。</h1><div class="modes"><button class="mode" onclick="start('practice')"><strong>練習用</strong><span>3分 ／ 3社 ／ 100万円</span></button><button class="mode" onclick="start('main')"><strong>本番用</strong><span>5分 ／ ${data.companies.length}社 ／ 10万円</span></button></div>${helpPanels()}</section>`}
function start(mode){clearInterval(clock);let duration=mode==='practice'?180:300;let news=newsSets[mode].map(n=>({...n,index:data.dates.indexOf(n.date)+(n.timing==='after'?0:-1)}));let start=news[0].index-60;let anchors=[[0,start],...news.flatMap(n=>[[n.at,n.index],[n.at+1,n.index+1]]),[duration,news.at(-1).index+duration-news.at(-1).at]];game={mode,duration,start,news,anchors,newsShown:-1,t:0,cash:mode==='practice'?1000000:100000,initial:mode==='practice'?1000000:100000,count:mode==='practice'?3:data.companies.length,visible:mode==='practice'?[0,1,2]:[0,1,2,3,4,5],selected:0,hold:Array(data.companies.length).fill(0),cost:Array(data.companies.length).fill(0),marks:[],startedAt:performance.now(),done:false};$('app').innerHTML=`<div class="top"><span id="mode" class="tag">${mode==='practice'?'練習用':'本番用'}</span><span class="timer" id="timer"></span></div><progress id="progress" max="${duration}" value="0" aria-label="経過時間"></progress><div class="stats"><div><span>使えるお金</span><b id="cash"></b></div><div><span>株を含む合計</span><b id="total"></b></div><div><span>増えた・減った</span><b id="profit"></b></div></div><div class="stocks" id="stocks">${game.visible.map(i=>{const c=data.companies[i];return `<button id="stock-${i}" class="stock" onclick="select(${i})"><strong>${c.name}</strong><svg id="mini-${i}" viewBox="0 0 150 32" aria-hidden="true"></svg><small id="stockprice-${i}"></small></button>`}).join('')}</div>${mode==='main'?`<button class="choose" onclick="openPicker()">ほかの会社を選ぶ（${game.count}社）</button><div id="holdings" class="holdings"></div><dialog id="picker"><div class="linehead"><h2>会社を選ぶ</h2><button onclick="closePicker()" aria-label="閉じる">閉じる</button></div><div class="picker-tabs"><button id="all-filter" onclick="filterCompanies(false)">すべて</button><button id="owned-filter" onclick="filterCompanies(true)">買っている会社</button></div><div id="match-count" class="muted small"></div><div id="matches"></div></dialog>`:''}<section class="board"><aside class="news-box" aria-label="ニュースのヒント"><div id="news-latest" role="status" aria-live="polite" aria-atomic="true"></div><details id="news-archive" class="hidden"><summary>これまでのニュース</summary><div id="news-history"></div></details></aside><div class="linehead"><div><h2 id="name"></h2><span class="muted small">1株の円換算価格</span></div><div style="text-align:right"><div class="price" id="price"></div><span class="small" id="daily"></span></div></div><svg id="chart" class="chart" viewBox="0 0 800 300" role="img" aria-label="選択中の会社の過去60営業日の価格推移"></svg><div class="position"><span id="date"></span></div><div class="quantity-row"><label for="quantity">買う株数</label><div class="stepper"><button id="less" onclick="changeQuantity(-1)" aria-label="1株減らす">−</button><input id="quantity" aria-label="買う株数" type="number" inputmode="numeric" min="1" max="1000000" step="1" value="1" oninput="quote()"><span>株</span><button id="more" onclick="changeQuantity(1)" aria-label="1株増やす">＋</button></div></div><div class="order-total"><span>購入金額</span><b id="order-cost"></b></div><div class="tradebar"><button class="buy" id="buy" onclick="buy()">1株 買う</button><button class="sell" id="sell" onclick="sell()">全部 売る</button></div><div class="position"><span id="owned"></span><span id="holdingProfit"></span></div><div id="message" role="status" aria-live="polite"></div></section><section id="result" class="result hidden"></section>${helpPanels()}`;paint();clock=setInterval(tick,1000);window.scrollTo(0,0)}
function replayIndex(t=game.t){const a=game.anchors;for(let k=1;k<a.length;k++){if(t<=a[k][0]){let [t0,i0]=a[k-1],[t1,i1]=a[k];return i0+Math.floor((i1-i0)*(t-t0)/(t1-t0))}}return a.at(-1)[1]}
function price(i,index=replayIndex()){return Math.round(data.companies[i].close[index]*fx.jpyPerUsd[index]*100)/100}
function total(){return game.cash+game.hold.reduce((a,q,i)=>a+q*price(i),0)}
function tick(){if(!game||game.done)return;const elapsed=Math.min(game.duration,Math.floor((performance.now()-game.startedAt)/1000));if(elapsed<=game.t)return;game.t=elapsed;if(game.t>=game.duration){finish();return}paint()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
function select(i){if(i<0||i>=game.count)return;if(i!==game.selected)$('quantity').value='1';game.selected=i;if(!game.visible.includes(i)){game.visible[game.visible.length-1]=i;renderStocks()}paint()}
function quantity(){return Number($('quantity').value)}
function validQuantity(q){return Number.isSafeInteger(q)&&q>=1&&q<=1000000}
function changeQuantity(delta){if(!game||game.done)return;let q=quantity();$('quantity').value=String(Math.min(1000000,Math.max(1,(validQuantity(q)?q:1)+delta)));quote()}
function quote(){if(!game)return;let q=quantity(),valid=validQuantity(q),amount=valid?Math.round(q*price(game.selected)):0;$('buy').textContent=valid?q.toLocaleString('ja-JP')+'株 買う':'買う';$('order-cost').textContent=valid?yen(amount)+(amount>game.cash?'（お金が足りません）':''):'1以上の整数を入力';$('buy').disabled=game.done||!valid||amount>game.cash;$('quantity').disabled=game.done;$('less').disabled=game.done||(valid&&q<=1);$('more').disabled=game.done||(valid&&q>=1000000)}
function buy(){tick();if(!game||game.done)return;let q=quantity();if(!validQuantity(q))return;let i=game.selected,p=price(i),amount=Math.round(q*p);if(amount>game.cash){$('message').textContent='使えるお金が足りません。';quote();return}game.cash-=amount;game.hold[i]+=q;game.cost[i]+=amount;game.marks.push({i,t:game.t,p,type:'買'});paint();$('message').textContent=data.companies[i].name+'を'+q.toLocaleString('ja-JP')+'株買いました（'+yen(amount)+'）。'}
function sell(){tick();if(!game||game.done)return;let i=game.selected;if(!game.hold[i])return;let amount=Math.round(game.hold[i]*price(i));game.cash+=amount;game.hold[i]=0;game.cost[i]=0;game.marks.push({i,t:game.t,p:price(i),type:'売'});paint();$('message').textContent=data.companies[i].name+'を全部売りました（'+yen(amount)+'）。'}
function paint(){const g=game,i=g.selected,p=price(i),sum=total(),diff=Math.round(sum-g.initial);$('timer').textContent=g.done?'終了':`残り ${Math.floor((g.duration-g.t)/60)}:${String((g.duration-g.t)%60).padStart(2,'0')}`;$('progress').value=g.t;$('cash').textContent=yen(g.cash);$('total').textContent=yen(sum);$('profit').textContent=(diff>=0?'+':'')+yen(diff);$('profit').className=diff>=0?'up':'down';$('name').textContent=data.companies[i].name;$('price').textContent=p.toLocaleString('ja-JP',{minimumFractionDigits:2,maximumFractionDigits:2})+'円';let daily=(p/price(i,replayIndex()-1)-1)*100;$('daily').textContent='前日比（円） '+(daily>=0?'+':'')+daily.toFixed(2)+'%';$('daily').className='small '+(daily>=0?'up':'down');$('date').textContent=data.dates[replayIndex()]+' の終値';$('owned').textContent='保有：'+g.hold[i].toLocaleString('ja-JP')+'株（'+yen(g.hold[i]*p)+'）';let hp=Math.round(g.hold[i]*p-g.cost[i]);$('holdingProfit').textContent='購入時から '+(hp>=0?'+':'')+yen(hp);quote();$('sell').disabled=g.done||!g.hold[i];for(const j of g.visible){$('stock-'+j).classList.toggle('active',i===j);$('stock-'+j).setAttribute('aria-pressed',String(i===j));$('stockprice-'+j).textContent=yen(price(j))+(g.hold[j]>0?' · 保有中':'');draw(j,true)}draw(i,false);paintHoldings();refreshPickerPrices();paintNews()}
function draw(i,mini){let g=game,end=replayIndex(),begin=Math.max(0,end-59),values=[];for(let k=begin;k<=end;k++)values.push(price(i,k));let lo=Math.min(...values),hi=Math.max(...values),pad=Math.max((hi-lo)*.18,1);lo-=pad;hi+=pad;let w=mini?150:800,h=mini?32:300,left=mini?0:90,right=mini?150:774,top=mini?2:20,bottom=mini?30:263;let x=k=>left+(k-begin)/Math.max(59,end-begin)*(right-left),y=v=>bottom-(v-lo)/(hi-lo)*(bottom-top);let pts=values.map((v,n)=>`${x(begin+n).toFixed(2)},${y(v).toFixed(2)}`).join(' ');let out='';if(!mini){for(let n=0;n<5;n++){let v=lo+(hi-lo)*n/4,yy=y(v);out+=`<line x1="${left}" y1="${yy}" x2="${right}" y2="${yy}" stroke="#283950"/><text x="${left-8}" y="${yy+5}" text-anchor="end" fill="#a7bad3" font-size="14">${Math.round(v)}</text>`}out+=`<text x="${left}" y="290" fill="#a7bad3" font-size="14">${data.dates[begin]}</text><text x="${right}" y="290" text-anchor="end" fill="#a7bad3" font-size="14">${data.dates[end]}</text>`}out+=`<polyline points="${pts}" fill="none" stroke="${colors[i%colors.length]}" stroke-width="${mini?2:3}" stroke-linejoin="round"/><circle cx="${x(end)}" cy="${y(values.at(-1))}" r="${mini?2:5}" fill="${colors[i%colors.length]}"/>`;if(!mini){for(const m of g.marks.filter(m=>m.i===i&&replayIndex(m.t)>=begin)){out+=`<circle cx="${x(replayIndex(m.t))}" cy="${y(m.p)}" r="7" fill="${m.type==='買'?'#69e2b9':'#fcadb1'}" stroke="#fff" stroke-width="1"/><text x="${x(replayIndex(m.t))}" y="${Math.max(15,y(m.p)-13)}" text-anchor="middle" fill="#fff" font-size="15">${m.type}</text>`}}$(mini?'mini-'+i:'chart').innerHTML=out}

const safe=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let onlyOwned=false;
function renderStocks(){$('stocks').innerHTML=game.visible.map(i=>`<button id="stock-${i}" class="stock" onclick="select(${i})"><strong>${safe(data.companies[i].name)}</strong><svg id="mini-${i}" viewBox="0 0 150 32" aria-hidden="true"></svg><small id="stockprice-${i}"></small></button>`).join('')}
function paintHoldings(){if(game.mode!=='main')return;let ids=game.hold.flatMap((q,i)=>q>0?[i]:[]);$('holdings').innerHTML=ids.length?'<span class="small muted">買っている会社</span>'+ids.map(i=>`<button class="held" onclick="select(${i})">${safe(data.companies[i].name)} · ${yen(game.hold[i]*price(i))}</button>`).join(''):''}
function openPicker(){if(!game||game.mode!=='main')return;onlyOwned=false;renderCompanies();$('picker').showModal()}
function closePicker(){$('picker').close()}
function filterCompanies(owned){onlyOwned=owned;renderCompanies()}
function listedCompanies(){return data.companies.map((c,i)=>({c,i})).filter(({i})=>i<game.count&&(!onlyOwned||game.hold[i]>0))}
function renderCompanies(){let found=listedCompanies();$('match-count').textContent=found.length+'社';$('all-filter').setAttribute('aria-pressed',String(!onlyOwned));$('owned-filter').setAttribute('aria-pressed',String(onlyOwned));$('matches').innerHTML=found.length?found.map(({c,i})=>`<button class="match" onclick="chooseCompany(${i})"><span>${safe(c.name)}<small>${safe(c.symbol)}</small></span><span id="pickprice-${i}">${yen(price(i))}${game.hold[i]>0?'<small>保有中</small>':''}</span></button>`).join(''):'<p class="muted">まだ株を買っていません。</p>'}
function refreshPickerPrices(){if(game.mode!=='main'||!$('picker').open)return;for(const {i} of listedCompanies()){const el=$('pickprice-'+i);if(el)el.innerHTML=yen(price(i))+(game.hold[i]>0?'<small>保有中</small>':'')}}
function chooseCompany(i){select(i);closePicker()}

function finish(){clearInterval(clock);if(game.mode==='main'&&$('picker').open)closePicker();game.t=game.duration;game.cash=Math.round(total());game.hold.fill(0);game.cost.fill(0);game.done=true;paint();let diff=game.cash-game.initial;$('message').textContent='自動売却が完了しました。';$('result').classList.remove('hidden');$('result').innerHTML=`<div class="tag">RESULT</div><h2>最終金額</h2><div class="amount">${yen(game.cash)}</div><p class="${diff>=0?'up':'down'}">最初から ${diff>=0?'+':''}${yen(diff)}</p><button onclick="start(game.mode)">もう一度遊ぶ</button> <button onclick="home()">モード選択</button>${newsReview()}`;$('result').scrollIntoView({behavior:'smooth',block:'center'})}

function hintHTML(n,index){return `<div class="news-meta">ニュース ${index+1} / ${game.news.length} · 当時の日付 ${safe(n.date)}</div><h3>${safe(n.title)}</h3><p>${safe(n.body)}</p>`}
function paintNews(){let shown=game.news.filter(n=>n.at<=game.t);if(game.newsShown===shown.length)return;game.newsShown=shown.length;$('news-latest').innerHTML=shown.length?hintHTML(shown.at(-1),shown.length-1):'<div class="news-meta">ニュースのヒント</div><p>最初のニュースは開始1分後</p>';$('news-archive').classList.toggle('hidden',shown.length<2);$('news-history').innerHTML=shown.slice(0,-1).map((n,i)=>'<article>'+hintHTML(n,i)+'</article>').join('')}
function newsReview(){if(!game.done)return '';const pct=v=>(v>=0?'+':'')+v.toFixed(2)+'%';return `<section class="help news-review"><details><summary>ニュースと値動きのふり返り</summary><div><p>発表前後の最初の終値を比較しています。円換算で変化が±1％未満なら「ほぼ横ばい」と表示します。変化がゼロ、またはニュースの影響がなかったという意味ではありません。</p>${game.news.map((n,k)=>`<article><h3>${k+1}. ${safe(n.title)}</h3><p class="muted small">発表：${n.date}（${n.timing==='after'?'取引終了後':n.timing==='before'?'取引開始前':'取引時間中'}）<br>比較：${data.dates[n.index]} → ${data.dates[n.index+1]}</p>${n.symbols.map(sym=>{let i=data.companies.findIndex(c=>c.symbol===sym),c=data.companies[i],a=price(i,n.index),b=price(i,n.index+1),r=(b/a-1)*100,raw=(c.close[n.index+1]/c.close[n.index]-1)*100;return `<p><b>${safe(c.name)}：${Math.abs(r)<1?'ほぼ横ばい':r>0?'上がった':'下がった'}（円換算 ${pct(r)}）</b><br>${yen(a)} → ${yen(b)}<br><span class="muted small">為替の影響を除く株価の変化：${pct(raw)}</span></p>`}).join('')}<p><b>考えられる見方</b><br>${safe(n.analysis)}</p><a href="${safe(n.source)}" target="_blank" rel="noopener">当時の企業発表を読む</a></article>`).join('')}<p>見方の説明は、発表内容と価格データからの分析です。一つの出来事だけが原因だと証明するものではなく、同じ内容でも次回に同じ値動きになるとは限りません。</p></div></details></section>`}

</script></body></html>
