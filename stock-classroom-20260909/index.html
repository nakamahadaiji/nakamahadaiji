<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>株式売買ゲーム｜動くチャートで売買</title><meta name="description" content="毎秒動く過去の株価チャートで、買う・売るだけの授業用ゲーム。"><style>
*{box-sizing:border-box}body{margin:0;background:#0c1423;color:#ecf2ff;font:16px/1.6 system-ui,-apple-system,sans-serif}button{font:inherit;cursor:pointer;border:0;border-radius:12px;min-height:48px;padding:12px 20px;font-weight:700;color:#eaf1ff;background:#25344e}button:hover{filter:brightness(1.12)}button:disabled{opacity:.35;cursor:default}:focus-visible{outline:3px solid #fff;outline-offset:3px}header{padding:16px 24px;border-bottom:1px solid #28374e;display:flex;justify-content:space-between;align-items:center}header b{letter-spacing:.07em}header small,.muted{color:#a3b3cc}main{max-width:1050px;margin:24px auto;padding:0 18px 35px}h1{font-size:clamp(28px,5vw,42px);line-height:1.4;margin:14px 0}h2{font-size:22px;margin:0}p{margin:10px 0 22px}.home{max-width:780px;margin:50px auto}.modes{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:28px}.mode{border:1px solid #354866;background:#142238;padding:28px;border-radius:18px;text-align:left}.mode strong{display:block;font-size:28px}.mode span{display:block;color:#aebed4;font-weight:400;margin-top:8px}.mode:first-child{border-color:#50d5b0}.tag{color:#60e3bb;font-size:14px;font-weight:700;letter-spacing:.1em}.top{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-bottom:18px}.timer{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.stats>div{padding:14px 18px;border:1px solid #2a3c56;border-radius:12px;background:#111e32}.stats span{display:block;font-size:14px;color:#aebed4}.stats b{font-size:clamp(18px,3vw,27px);font-variant-numeric:tabular-nums}.up{color:#65e5ba}.down{color:#ff969a}.stocks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.stock{padding:12px;text-align:left;border:1px solid #2b3f5b;background:#142238;min-width:0}.stock.active{border:2px solid #65e5ba;padding:11px;background:#1b3342}.stock strong{display:block;white-space:nowrap;font-size:16px}.stock small{display:block;font-size:14px;color:#aebed4}.stock svg{width:100%;height:32px;display:block;margin:5px 0}.board{padding:22px;border:1px solid #2a3c56;background:#101d30;border-radius:16px}.price{font-size:32px;font-weight:800;line-height:1.3;font-variant-numeric:tabular-nums}.chart{width:100%;display:block;height:auto;margin:14px 0}.chart text{font-family:system-ui,sans-serif}.linehead{display:flex;justify-content:space-between;gap:14px;align-items:center}.tradebar{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.buy{background:#69e2b9;color:#07251c;font-size:21px}.sell{background:#fcadb1;color:#391217;font-size:21px}.position{display:flex;justify-content:space-between;gap:10px;color:#aebed4;font-size:14px;margin-top:8px}.notice{font-size:14px;color:#a3b3cc;margin-top:20px}details{margin-top:18px;font-size:14px;color:#a3b3cc}summary{cursor:pointer}a{color:#8cbcff}.result{text-align:center;padding:30px 16px;border-radius:18px;border:1px solid #385272;margin-top:20px;background:#142238}.result .amount{font-size:clamp(32px,7vw,56px);font-weight:900}.hidden{display:none!important}#message{min-height:28px;margin:10px 0;color:#8de9c9;font-size:14px}progress{width:100%;height:5px;accent-color:#65e5ba;display:block;margin-bottom:20px}.small{font-size:14px} @media(max-width:600px){main{margin:14px auto;padding:0 12px 24px}header{padding:12px}header small{display:none}.board{padding:14px}.stats{gap:6px}.stats>div{padding:10px 8px}.stats span{font-size:12px}.stats b{font-size:18px}.stock{padding:8px}.stock.active{padding:7px}.stock strong{font-size:14px}.stock small{font-size:12px}.modes{grid-template-columns:1fr}.home{margin:28px auto}.tradebar{gap:8px}.buy,.sell{font-size:18px;padding:13px 8px}.position{flex-wrap:wrap}.price{font-size:27px}.timer{font-size:21px}}

.stock strong{white-space:normal;overflow-wrap:anywhere;line-height:1.4}.choose{width:100%;margin:0 0 14px;border:1px solid #496184;background:#1b2c45}.holdings{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}.held{min-height:38px;padding:6px 10px;font-size:14px}.holdings:empty{display:none}dialog{color:#ecf2ff;background:#142238;border:1px solid #496184;border-radius:18px;width:min(580px,94vw);max-height:85dvh;padding:22px}dialog::backdrop{background:#030912bd}dialog .linehead{margin-bottom:18px}.picker-tabs{display:flex;gap:8px;margin-bottom:12px}.picker-tabs button{font-size:14px;min-height:40px;padding:8px 12px}.picker-tabs [aria-pressed="true"]{background:#69e2b9;color:#07251c}#matches{max-height:48dvh;overflow-y:auto;margin-top:8px;overscroll-behavior:contain}.match{display:flex;justify-content:space-between;text-align:left;align-items:center;gap:16px;width:100%;background:transparent;border-bottom:1px solid #30445f;border-radius:0;padding:12px 8px;font-size:16px}.match>span:last-child{flex-shrink:0;text-align:right}.match small{display:block;color:#a3b3cc;font-weight:400;font-size:14px}

.help{margin-top:22px}.help details{border:1px solid #30445f;border-radius:12px;margin:10px 0;background:#111e32;font-size:16px;color:#c5d2e5}.help summary{padding:14px 16px;font-weight:700;color:#eaf1ff;cursor:pointer}.help details>div{padding:0 16px 16px}.help p{margin:12px 0}.help ol{padding-left:24px}.help table{width:100%;border-collapse:collapse;font-size:14px}.help th,.help td{padding:10px 5px;text-align:left;border-bottom:1px solid #344860}.help th{color:#65e5ba}.linehead>div{min-width:0}.linehead #name{overflow-wrap:anywhere}#exchange{font-size:14px}@media(max-width:600px){.linehead{align-items:flex-start}.linehead #name{font-size:18px}.linehead .price{font-size:25px}.help summary{font-size:15px}.help details>div{padding:0 12px 12px}}
</style></head><body><header><b>株式売買ゲーム</b></header><main id="app"><p>過去の株価を読み込んでいます…</p></main><script>
let data,fx,game=null,clock=null;const $=id=>document.getElementById(id);const yen=n=>Math.round(n).toLocaleString('ja-JP')+'円';const colors=['#62e4bb','#79b5ff','#f2c676','#ef93bd','#ad9aff','#ffac72'];
Promise.all(['./history.json?v=3','./fx.json?v=1'].map(url=>fetch(url).then(r=>{if(!r.ok)throw Error();return r.json()}))).then(([d,f])=>{if(d.companies.length<6||d.dates.length<321||f.dates.length!==d.dates.length||!d.dates.every((date,i)=>date===f.dates[i]&&Number.isFinite(f.jpyPerUsd[i])&&f.jpyPerUsd[i]>0))throw Error();data=d;fx=f;home()}).catch(()=>{$('app').innerHTML='<h1>株価データを読み込めませんでした</h1><button onclick="location.reload()">もう一度読み込む</button>'});

function helpPanels(){return `<section class="help"><details><summary>遊び方</summary><div><ol><li>練習用か本番用を選びます。</li><li>会社を選び、チャートを見ながら「1万円分 買う」「全部 売る」を押します。</li><li>終了すると持っている株をすべて売り、最終金額が出ます。</li></ol><p>1秒で過去の1営業日が進みます。会社の選択中や説明を開いている間も進みます。</p><p>チャートの「買」は購入した位置、「売」は売却した位置です。「株を含む合計」は、持っている株を今すべて売った場合のお金も含みます。</p></div></details><details><summary>過去の株価と、円表示のしくみ</summary><div><p><b>過去の実際の株価と、その日の為替レートを使って円に換算しています。</b>為替レートとは「1ドルが何円か」という交換の割合です。</p><p><b>円での株価 ＝ ドルでの株価 × 1ドルあたりの円の金額</b></p><p>例えば、次のように変わります（説明用の仮の数字です）。</p><table><thead><tr><th>ドルの株価</th><th>1ドルの値段</th><th>円での株価</th></tr></thead><tbody><tr><td>100ドル</td><td>110円</td><td>11,000円</td></tr><tr><td>110ドル</td><td>110円</td><td>12,100円</td></tr><tr><td>110ドル</td><td>100円</td><td>11,000円</td></tr></tbody></table><p>ドルで株価が上がっても、1ドルを円に換えたときの金額が減ると、円での利益は小さくなります。つまり、<b>株価と円高・円安の両方</b>が結果に影響します。</p><p>以前の「開始時1,000円」は、実際の株価の上がり下がりの割合だけを再現する設定でした。現在はこの設定をやめ、円換算した価格を使うため、会社ごとに開始価格が異なります。</p></div></details><details><summary>データと計算の条件</summary><div><p>株価は${data.dates[0]}〜${data.dates.at(-1)}の米国株の終値（その日の取引が終わったときの価格）です。開始日は毎回変わります。株価も為替も現在の価格ではありません。</p><p>為替は米国の中央銀行が公表する日次データを使用しています。その日の値がない場合は、直前に公表された日の値を使い、画面にその日付を添えます。株価と為替の観測時刻は同一ではないため、その瞬間の実際の売買価格を完全に再現するものではありません。</p><p>使っていないお金は円のままです。購入時はその日の円換算価格で買い、売却時は売る日の円換算価格で円に戻します。1万円で1株に満たない場合も、小数の株数を買える授業用の設定です。</p><p>円換算価格は小数第2位、売却金額は1円単位に丸めます。税金・手数料・配当は省略しています。</p><p><a href="${data.source}" target="_blank" rel="noopener">株価データ：Plotly公開データ</a><br><a href="${fx.source}" target="_blank" rel="noopener">為替データ：米連邦準備制度 H.10</a></p></div></details></section>`}

function home(){clearInterval(clock);game=null;$('app').innerHTML=`<section class="home"><div class="tag">CHART GAME</div><h1>動くチャートを見て、<br>買う。売る。</h1><div class="modes"><button class="mode" onclick="start('practice')"><strong>練習用</strong><span>3分 ／ 3社 ／ 100万円</span></button><button class="mode" onclick="start('main')"><strong>本番用</strong><span>5分 ／ ${data.companies.length}社 ／ 10万円</span></button></div>${helpPanels()}</section>`}
function start(mode){clearInterval(clock);let duration=mode==='practice'?180:300;let start=20+Math.floor(Math.random()*(data.dates.length-duration-20));game={mode,duration,start,t:0,cash:mode==='practice'?1000000:100000,initial:mode==='practice'?1000000:100000,count:mode==='practice'?3:data.companies.length,visible:mode==='practice'?[0,1,2]:[0,1,2,3,4,5],selected:0,hold:Array(data.companies.length).fill(0),cost:Array(data.companies.length).fill(0),marks:[],startedAt:performance.now(),done:false};$('app').innerHTML=`<div class="top"><span id="mode" class="tag">${mode==='practice'?'練習用':'本番用'}</span><span class="timer" id="timer"></span></div><progress id="progress" max="${duration}" value="0" aria-label="経過時間"></progress><div class="stats"><div><span>使えるお金</span><b id="cash"></b></div><div><span>株を含む合計</span><b id="total"></b></div><div><span>増えた・減った</span><b id="profit"></b></div></div><div class="stocks" id="stocks">${game.visible.map(i=>{const c=data.companies[i];return `<button id="stock-${i}" class="stock" onclick="select(${i})"><strong>${c.name}</strong><svg id="mini-${i}" viewBox="0 0 150 32" aria-hidden="true"></svg><small id="stockprice-${i}"></small></button>`}).join('')}</div>${mode==='main'?`<button class="choose" onclick="openPicker()">ほかの会社を選ぶ（${game.count}社）</button><div id="holdings" class="holdings"></div><dialog id="picker"><div class="linehead"><h2>会社を選ぶ</h2><button onclick="closePicker()" aria-label="閉じる">閉じる</button></div><div class="picker-tabs"><button id="all-filter" onclick="filterCompanies(false)">すべて</button><button id="owned-filter" onclick="filterCompanies(true)">買っている会社</button></div><div id="match-count" class="muted small"></div><div id="matches"></div></dialog>`:''}<section class="board"><div class="linehead"><div><h2 id="name"></h2><span class="muted small">1株の円換算価格</span></div><div style="text-align:right"><div class="price" id="price"></div><div id="dollar" class="muted small"></div><div id="exchange" class="muted small"></div><span class="small" id="daily"></span></div></div><svg id="chart" class="chart" viewBox="0 0 800 300" role="img" aria-label="選択中の会社の過去60営業日の価格推移"></svg><div class="position"><span id="date"></span></div><div class="tradebar"><button class="buy" id="buy" onclick="buy()">1万円分 買う</button><button class="sell" id="sell" onclick="sell()">全部 売る</button></div><div class="position"><span id="owned"></span><span id="holdingProfit"></span></div><div id="message" role="status" aria-live="polite"></div></section><section id="result" class="result hidden"></section>${helpPanels()}`;paint();clock=setInterval(tick,1000);window.scrollTo(0,0)}
function price(i,index=game.start+game.t){return Math.round(data.companies[i].close[index]*fx.jpyPerUsd[index]*100)/100}
function total(){return game.cash+game.hold.reduce((a,q,i)=>a+q*price(i),0)}
function tick(){if(!game||game.done)return;const elapsed=Math.min(game.duration,Math.floor((performance.now()-game.startedAt)/1000));if(elapsed<=game.t)return;game.t=elapsed;if(game.t>=game.duration){finish();return}paint()}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick()});
function select(i){if(i<0||i>=game.count)return;game.selected=i;if(!game.visible.includes(i)){game.visible[game.visible.length-1]=i;renderStocks()}paint()}
function buy(){tick();if(!game||game.done||game.cash<10000)return;let i=game.selected,p=price(i);game.cash-=10000;game.hold[i]+=10000/p;game.cost[i]+=10000;game.marks.push({i,t:game.t,p,type:'買'});paint();$('message').textContent=data.companies[i].name+'を1万円分買いました。'}
function sell(){tick();if(!game||game.done)return;let i=game.selected;if(!game.hold[i])return;let amount=Math.round(game.hold[i]*price(i));game.cash+=amount;game.hold[i]=0;game.cost[i]=0;game.marks.push({i,t:game.t,p:price(i),type:'売'});paint();$('message').textContent=data.companies[i].name+'を全部売りました（'+yen(amount)+'）。'}
function paint(){const g=game,i=g.selected,p=price(i),sum=total(),diff=Math.round(sum-g.initial);$('timer').textContent=g.done?'終了':`残り ${Math.floor((g.duration-g.t)/60)}:${String((g.duration-g.t)%60).padStart(2,'0')}`;$('progress').value=g.t;$('cash').textContent=yen(g.cash);$('total').textContent=yen(sum);$('profit').textContent=(diff>=0?'+':'')+yen(diff);$('profit').className=diff>=0?'up':'down';$('name').textContent=data.companies[i].name;$('price').textContent=p.toLocaleString('ja-JP',{minimumFractionDigits:2,maximumFractionDigits:2})+'円';const index=g.start+g.t;$('dollar').textContent=data.companies[i].close[index].toLocaleString('ja-JP',{minimumFractionDigits:2,maximumFractionDigits:4})+'ドル';$('exchange').textContent='1ドル＝'+fx.jpyPerUsd[index].toFixed(2)+'円'+(fx.observationDates[index]!==data.dates[index]?'（'+fx.observationDates[index]+'）':'');let daily=(p/price(i,g.start+g.t-1)-1)*100;$('daily').textContent='前日比（円） '+(daily>=0?'+':'')+daily.toFixed(2)+'%';$('daily').className='small '+(daily>=0?'up':'down');$('date').textContent=data.dates[g.start+g.t]+' の終値';$('owned').textContent='この会社の株：'+yen(g.hold[i]*p);let hp=Math.round(g.hold[i]*p-g.cost[i]);$('holdingProfit').textContent='購入時から '+(hp>=0?'+':'')+yen(hp);$('buy').disabled=g.done||g.cash<10000;$('sell').disabled=g.done||!g.hold[i];for(const j of g.visible){$('stock-'+j).classList.toggle('active',i===j);$('stock-'+j).setAttribute('aria-pressed',String(i===j));$('stockprice-'+j).textContent=yen(price(j))+(g.hold[j]>0?' · 保有中':'');draw(j,true)}draw(i,false);paintHoldings();refreshPickerPrices()}
function draw(i,mini){let g=game,end=g.start+g.t,begin=Math.max(0,end-59),values=[];for(let k=begin;k<=end;k++)values.push(price(i,k));let lo=Math.min(...values),hi=Math.max(...values),pad=Math.max((hi-lo)*.18,1);lo-=pad;hi+=pad;let w=mini?150:800,h=mini?32:300,left=mini?0:90,right=mini?150:774,top=mini?2:20,bottom=mini?30:263;let x=k=>left+(k-begin)/Math.max(59,end-begin)*(right-left),y=v=>bottom-(v-lo)/(hi-lo)*(bottom-top);let pts=values.map((v,n)=>`${x(begin+n).toFixed(2)},${y(v).toFixed(2)}`).join(' ');let out='';if(!mini){for(let n=0;n<5;n++){let v=lo+(hi-lo)*n/4,yy=y(v);out+=`<line x1="${left}" y1="${yy}" x2="${right}" y2="${yy}" stroke="#283950"/><text x="${left-8}" y="${yy+5}" text-anchor="end" fill="#a7bad3" font-size="14">${Math.round(v)}</text>`}out+=`<text x="${left}" y="290" fill="#a7bad3" font-size="14">${data.dates[begin]}</text><text x="${right}" y="290" text-anchor="end" fill="#a7bad3" font-size="14">${data.dates[end]}</text>`}out+=`<polyline points="${pts}" fill="none" stroke="${colors[i%colors.length]}" stroke-width="${mini?2:3}" stroke-linejoin="round"/><circle cx="${x(end)}" cy="${y(values.at(-1))}" r="${mini?2:5}" fill="${colors[i%colors.length]}"/>`;if(!mini){for(const m of g.marks.filter(m=>m.i===i&&g.start+m.t>=begin)){out+=`<circle cx="${x(g.start+m.t)}" cy="${y(m.p)}" r="7" fill="${m.type==='買'?'#69e2b9':'#fcadb1'}" stroke="#fff" stroke-width="1"/><text x="${x(g.start+m.t)}" y="${Math.max(15,y(m.p)-13)}" text-anchor="middle" fill="#fff" font-size="15">${m.type}</text>`}}$(mini?'mini-'+i:'chart').innerHTML=out}

const safe=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let onlyOwned=false;
function renderStocks(){$('stocks').innerHTML=game.visible.map(i=>`<button id="stock-${i}" class="stock" onclick="select(${i})"><strong>${safe(data.companies[i].name)}</strong><svg id="mini-${i}" viewBox="0 0 150 32" aria-hidden="true"></svg><small id="stockprice-${i}"></small></button>`).join('')}
function paintHoldings(){if(game.mode!=='main')return;let ids=game.hold.flatMap((q,i)=>q>0?[i]:[]);$('holdings').innerHTML=ids.length?'<span class="small muted">買っている会社</span>'+ids.map(i=>`<button class="held" onclick="select(${i})">${safe(data.companies[i].name)} · ${yen(game.hold[i]*price(i))}</button>`).join(''):''}
function openPicker(){if(!game||game.mode!=='main')return;onlyOwned=false;renderCompanies();$('picker').showModal()}
function closePicker(){$('picker').close()}
function filterCompanies(owned){onlyOwned=owned;renderCompanies()}
function listedCompanies(){return data.companies.map((c,i)=>({c,i})).filter(({i})=>i<game.count&&(!onlyOwned||game.hold[i]>0))}
function renderCompanies(){let found=listedCompanies();$('match-count').textContent=found.length+'社';$('all-filter').setAttribute('aria-pressed',String(!onlyOwned));$('owned-filter').setAttribute('aria-pressed',String(onlyOwned));$('matches').innerHTML=found.length?found.map(({c,i})=>`<button class="match" onclick="chooseCompany(${i})"><span>${safe(c.name)}<small>${safe(c.symbol)}</small></span><span id="pickprice-${i}">${yen(price(i))}${game.hold[i]>0?'<small>保有中</small>':''}</span></button>`).join(''):'<p class="muted">まだ株を買っていません。</p>'}
function refreshPickerPrices(){if(game.mode!=='main'||!$('picker').open)return;for(const {i} of listedCompanies()){const el=$('pickprice-'+i);if(el)el.innerHTML=yen(price(i))+(game.hold[i]>0?'<small>保有中</small>':'')}}
function chooseCompany(i){select(i);closePicker()}

function finish(){clearInterval(clock);if(game.mode==='main'&&$('picker').open)closePicker();game.t=game.duration;game.cash=Math.round(total());game.hold.fill(0);game.cost.fill(0);game.done=true;paint();let diff=game.cash-game.initial;$('message').textContent='自動売却が完了しました。';$('result').classList.remove('hidden');$('result').innerHTML=`<div class="tag">RESULT</div><h2>最終金額</h2><div class="amount">${yen(game.cash)}</div><p class="${diff>=0?'up':'down'}">最初から ${diff>=0?'+':''}${yen(diff)}</p><button onclick="start(game.mode)">別の期間でもう一度</button> <button onclick="home()">モード選択</button>`;$('result').scrollIntoView({behavior:'smooth',block:'center'})}
</script></body></html>
