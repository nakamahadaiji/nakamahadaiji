<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>株式売買ゲーム</title>
<style>html,body,iframe{width:100%;height:100%;margin:0;border:0;display:block;background:#f5f7fb}iframe{height:100dvh}</style>
</head>
<body>
<iframe id="game" src="final.html?v=20260704j" title="株式売買ゲーム"></iframe>
<script>
(() => {
  const frame = document.getElementById('game');
  const sourceByTag = { '速報':'市場速報', '企業':'企業ニュース', '市場':'国内市場', '海外':'海外市場', '商品':'商品市場', '業種':'業界ニュース', '為替':'為替市場', '政策':'政策ニュース', '債券':'債券市場', '電力':'エネルギー', '消費':'消費ニュース', '観測':'マーケット観測', '引け前':'引け前情報' };
  const makeLead = (title) => {
    if (/上方修正|上積み|受注/.test(title)) return '需要の強さを示す材料として受け止められ、関連企業にも買いが広がるかが注目されます。';
    if (/上昇|急伸|高まで/.test(title)) return '市場では関連銘柄への資金流入が意識され、取引開始後の反応に関心が集まっています。';
    if (/下落|売り|軟調|重し|警戒/.test(title)) return '短期筋の売りが出やすい局面です。影響を受ける業種と、逆に資金が向かう業種を見極めます。';
    if (/利上げ|金利/.test(title)) return '金利の変化は、銀行・不動産・輸出関連など幅広い業種の見通しに影響します。';
    if (/原油|資源|鉄鉱石|銅/.test(title)) return '資源価格の変動は、資源会社だけでなく運輸・化学・食品などのコストにも波及します。';
    if (/半導体|AI|データセンター/.test(title)) return '設備投資の方向性を示す材料として、部品・装置・通信関連まで幅広く注目されています。';
    if (/中国/.test(title)) return '中国の景気・政策の変化は、素材や機械、消費関連の需要見通しに影響します。';
    return 'この材料を受け、市場がどの業種を買い、どの業種を売るかに注目が集まっています。';
  };
  const enhance = () => {
    const doc = frame.contentDocument;
    if (!doc) return;
    const feed = doc.getElementById('newsFeed');
    if (!feed || feed.dataset.enhanced) return;
    feed.dataset.enhanced = 'yes';
    const style = doc.createElement('style');
    style.textContent = `
      .news-item{padding:14px 15px!important;cursor:pointer}.news-item p{font-size:15px!important;line-height:1.58!important;letter-spacing:.01em}.news-item .news-summary{display:block;margin-top:8px;color:#59687b;font-size:12px;line-height:1.68;font-weight:500}.news-item .news-source{font-size:11px;font-weight:800;color:#64748b}.news-item .news-open{display:block;margin-top:9px;color:#1d5cab;font-size:11px;font-weight:800}.news-item.is-open{background:#f6f9ff}.news-item.is-open .news-summary{display:block}.news-item:not(.is-open) .news-summary{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}@media(max-width:760px){.news-item{padding:13px 14px!important}.news-item p{font-size:14px!important}.news-item .news-summary{font-size:12px!important}}
    `;
    doc.head.appendChild(style);
    const update = () => {
      feed.querySelectorAll('.news-item').forEach((item) => {
        if (item.dataset.reader) return;
        item.dataset.reader = 'yes';
        const title = item.querySelector('p')?.textContent?.trim() || '';
        const tag = item.querySelector('.news-tag')?.textContent?.trim() || '';
        const meta = item.querySelector('div');
        if (meta) {
          const source = doc.createElement('span');
          source.className = 'news-source';
          source.textContent = sourceByTag[tag] || 'マーケット情報';
          meta.insertBefore(source, meta.querySelector('time'));
        }
        const summary = doc.createElement('span');
        summary.className = 'news-summary';
        summary.textContent = makeLead(title);
        const open = doc.createElement('span');
        open.className = 'news-open';
        open.textContent = '詳細を読む';
        item.append(summary, open);
        item.addEventListener('click', () => {
          item.classList.toggle('is-open');
          open.textContent = item.classList.contains('is-open') ? '閉じる' : '詳細を読む';
        });
      });
    };
    new MutationObserver(update).observe(feed, { childList:true, subtree:true });
    update();
  };
  frame.addEventListener('load', () => {
    const doc = frame.contentDocument;
    if (!doc) return;
    const wait = setInterval(() => {
      if (doc.getElementById('newsFeed')) { clearInterval(wait); enhance(); }
    }, 100);
  });
})();
</script>
</body>
</html>
